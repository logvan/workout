<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0E14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Герой">
<meta name="format-detection" content="telephone=no">
<title>Дневник героя</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>if (/tgWebApp/.test(location.hash) || window.TelegramWebviewProxy || /Telegram/i.test(navigator.userAgent)) document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>');</script>
<style>
:root{
  --bg:#0B0E14; --card:#141922; --card2:#1A2030; --line:#1F2633; --line2:#2A3242;
  --text:#F2F4F8; --hint:#8B93A7; --hint2:#6B7388; --hint3:#4A5266;
  --acc:#FF5A4E; --acc-soft:rgba(255,90,78,.14); --acc-line:rgba(255,90,78,.45);
  --xp:#F5C542; --xp-soft:rgba(245,197,66,.14); --sec:#F5A524;
  --blue:#7FB0FF; --blue-soft:rgba(59,130,246,.18); --green:#4ADE80; --purple:#A78BFA; --red:#FF5A4E;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Onest',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;line-height:1.35;-webkit-text-size-adjust:100%}
body{min-height:100vh;min-height:100dvh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
input,select,textarea{-webkit-appearance:none;appearance:none}
input::placeholder,textarea::placeholder{color:var(--hint3)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:calc(var(--safe-t) + 14px) 16px calc(max(10px,calc(var(--safe-b) - 12px)) + 96px)}
#app.notab{padding-bottom:calc(var(--safe-b) + 24px)}
.col{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--hint)}
.label{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--hint)}
.h1{margin:2px 0 0;font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em}
.sub{font-size:13px;color:var(--hint)}
.small{font-size:12px;color:var(--hint)}
.tiny{font-size:11px;color:var(--hint2)}

.card{background:var(--card);border-radius:20px;padding:14px}
.card.tight{padding:10px 12px}
.card.hl{box-shadow:0 0 0 1.5px var(--acc-line)}
.tile{background:var(--card2);border-radius:12px;padding:8px 10px}
.sep{border-top:1px solid var(--card2)}

.hdr{display:flex;align-items:center;gap:12px;margin-bottom:2px}
.back{width:44px;height:44px;flex:none;border-radius:22px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.iconbtn{width:40px;height:40px;flex:none;border-radius:20px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--text)}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

.btn{height:50px;border-radius:25px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px;padding:0 18px;background:var(--text);color:var(--bg);width:100%}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line2);font-weight:600}
.btn.dark{background:var(--card);color:var(--text);font-weight:600}
.btn.sm{height:42px;border-radius:14px;font-size:15px}
.btn[disabled]{opacity:.45}
.btn .xp{font-weight:500;opacity:.75}
.dashed{height:48px;border-radius:14px;border:1.5px dashed var(--line2);display:flex;align-items:center;justify-content:center;gap:6px;color:var(--hint);font-weight:600;width:100%}
.link{color:var(--hint);font-size:14px;padding:10px 0;text-align:center;width:100%}
.danger{color:var(--red)}

.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:8px;font-size:12px;font-weight:700;white-space:nowrap}
.chip.xp{background:var(--xp-soft);color:var(--xp)}
.chip.acc{background:var(--acc-soft);color:#FF8A80}
.chip.sec{background:rgba(245,165,36,.16);color:var(--sec)}
.chip.blue{background:var(--blue-soft);color:var(--blue)}
.chip.mut{background:var(--line);color:var(--hint)}
.pill{height:34px;padding:0 12px;border-radius:17px;font-size:13px;border:1px solid var(--line2);white-space:nowrap}
.pill.on{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}
.seg{display:grid;gap:3px;padding:3px;border-radius:12px;background:var(--line)}
.seg button{height:36px;border-radius:9px;font-size:13px;color:var(--hint)}
.seg button.on{background:var(--card);color:var(--text);font-weight:700}
.choice{height:42px;border-radius:12px;border:1.5px solid var(--line);color:var(--hint);font-size:14px}
.choice.on{border-color:var(--acc);background:var(--acc-soft);color:var(--text);font-weight:700}

.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--hint)}
.inp{height:46px;padding:0 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);outline:none;font-size:16px;font-weight:600;color:var(--text);width:100%}
.inp:focus{border-color:var(--line2)}
.inp.c{text-align:center;font-size:18px;font-weight:700}
textarea.inp{height:auto;min-height:80px;padding:10px 12px;font-weight:500;font-size:16px}
.reps{width:58px;height:46px;border-radius:12px;text-align:center;font-size:20px;font-weight:700;background:var(--bg);border:1.5px solid var(--line2);outline:none;color:var(--text)}
.reps::placeholder{color:#2C3444}
.reps.ok{border-color:var(--green)}.reps.hi{border-color:var(--xp)}.reps.lo{border-color:var(--red)}

.bar{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px}
.xpbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.xpbar>i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#E0A82E,var(--xp));transition:width .6s}

/* схема мышц */
.body{display:flex;gap:4px;align-items:flex-start;justify-content:center}
.bodyv{position:relative;flex:none}
.bodyv img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;user-select:none;-webkit-user-select:none}
.body.fill{width:100%;gap:6px!important}
.body.fill .bodyv{flex:1 1 0;width:auto!important;height:auto!important;aspect-ratio:600/1160;min-width:0}
.bodyv svg{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:multiply}

/* таб-бар */
#tabbar{--tb-b:max(10px,calc(var(--safe-b) - 12px));position:fixed;left:16px;right:16px;bottom:var(--tb-b);z-index:20;max-width:420px;margin:0 auto;height:64px;display:flex;justify-content:space-around;align-items:center;padding:0 10px;border-radius:32px;background:rgba(22,26,36,.92);border:1px solid rgba(255,255,255,.06);box-shadow:0 10px 30px rgba(0,0,0,.45);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
#tabbar button{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#8D95A6;transition:background .2s,color .2s,transform .2s}
#tabbar button:active{transform:scale(.92)}
#tabbar button.on{background:var(--acc);color:#fff;box-shadow:0 4px 16px rgba(255,90,78,.35)}
#tabbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* квесты */
.quest{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:4px;border-top:1px solid var(--card2);text-align:left}
.qdot{width:24px;height:24px;flex:none;border-radius:12px;border:1.5px solid var(--hint3);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.qdot.on{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.quest.done .qt{color:var(--hint)}
.quest.done .chip{background:transparent;color:var(--hint3)}

/* упражнения */
.exrow{display:flex;align-items:center;gap:8px;min-height:58px;padding:0 4px 0 6px;border-radius:16px;background:var(--card)}
.exrow .thumb{width:28px;height:58px;flex:none;display:flex;align-items:center;justify-content:center}
.addbtn{width:40px;height:40px;flex:none;border-radius:12px;background:var(--line);font-size:20px;font-weight:600}
.addbtn.on{background:var(--acc);color:var(--bg)}
.setrow{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:14px;background:var(--card2)}
.setrow.done{opacity:.85}
.stepper{display:flex;align-items:center;background:var(--line);border-radius:12px}
.stepper button{width:44px;height:44px;font-size:22px;color:var(--acc)}
.stepper b{min-width:64px;text-align:right;font-size:22px}
.dots{display:grid;gap:4px}
.dots button{height:6px;border-radius:3px;background:var(--line)}
.dots button.on{background:var(--acc)}.dots button.past{background:var(--text)}.dots button.part{background:linear-gradient(90deg,var(--text) 50%,var(--line) 50%)}
.chart{height:56px;display:flex;align-items:flex-end;gap:6px}
.chart i{flex:1;border-radius:5px;background:var(--line2)}
.chart i.last{background:var(--acc)}

/* питание */
.kbju{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px}
.kbju .v{font-weight:700;font-size:20px}
.kbju .v small{font-weight:400;font-size:12px;color:var(--hint)}
.meal{background:var(--card);border-radius:18px;padding:6px 14px 8px}
.meal.on{box-shadow:inset 0 0 0 1.5px var(--acc)}
.mealadd{width:36px;height:36px;border-radius:18px;background:var(--line);font-size:18px}
.meal.on .mealadd{background:var(--text);color:var(--bg)}
.fitem{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:5px 0;width:100%;text-align:left}
.fitem .k{color:var(--hint);white-space:nowrap}
.inputbar{position:fixed;left:0;right:0;bottom:calc(max(10px,calc(var(--safe-b) - 12px)) + 68px);z-index:15;padding:8px 16px;background:linear-gradient(transparent,var(--bg) 35%)}
.inputbar .in{max-width:488px;margin:0 auto;display:flex;align-items:center;gap:6px;height:52px;padding:0 6px 0 14px;border-radius:26px;background:var(--card);border:1.5px solid var(--line)}
.inputbar input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:16px}
.sendbtn{width:40px;height:40px;border-radius:20px;background:var(--text);color:var(--bg);display:flex;align-items:center;justify-content:center}

/* всплывающие окна */
#sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55)}
#sheet[hidden]{display:none}
#sheet .box{width:100%;max-width:520px;background:var(--card);border-radius:24px 24px 0 0;padding:18px 16px calc(var(--safe-b) + 18px);max-height:88vh;overflow:auto}
#toast{position:fixed;left:50%;top:calc(var(--safe-t) + 12px);transform:translateX(-50%);z-index:50;max-width:92vw;padding:10px 16px;border-radius:14px;background:#F2F4F8;color:#0B0E14;font-size:14px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.4);white-space:pre-line}
#toast[hidden]{display:none}
#timer{position:fixed;left:0;right:0;top:calc(var(--safe-t) + 6px);z-index:30;display:flex;justify-content:center;padding:0 16px}
#timer[hidden]{display:none}
body.timing.insession #app{padding-top:calc(var(--safe-t) + 70px)}
body:not(.insession) #timer{display:none}
#timer .tb{width:100%;max-width:488px;display:flex;align-items:center;gap:6px;padding:6px 6px 6px 14px;border-radius:20px;background:rgba(32,40,56,.96);box-shadow:0 10px 30px rgba(0,0,0,.45);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line2);position:relative;overflow:hidden}
#timer b{font-size:22px;min-width:60px}
#timer .tb .small{display:none}
#timer button{height:38px;min-width:42px;display:grid;place-items:center;border-radius:12px;background:var(--line2);font-weight:700}
#timer i{position:absolute;left:0;bottom:0;height:3px;background:var(--acc)}

.lock{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.logo{width:88px;height:88px;border-radius:26px;background:var(--card);border:1.5px solid var(--acc-line);display:flex;align-items:center;justify-content:center}
.fid{width:128px;height:128px;border-radius:64px;border:2px solid var(--acc);background:var(--card);display:flex;align-items:center;justify-content:center}
.syncdot{width:8px;height:8px;border-radius:4px;background:var(--green);display:inline-block}
.syncdot.wait{background:var(--xp)}.syncdot.err{background:var(--red)}
.steps li{margin:0 0 6px;color:#C3C9D6;font-size:13px}
.empty{padding:22px;text-align:center;color:var(--hint);font-size:14px;background:var(--card);border-radius:18px}
.stage{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 6px 10px;border-radius:16px;background:var(--card);border:1.5px solid transparent}
.stage.cur{border-color:var(--acc-line)}.stage.sel{border-color:var(--acc)}.stage.locked{opacity:.5}
.wchart{width:100%;height:120px}
@keyframes swl{from{transform:translateX(28px);opacity:.3}to{transform:none;opacity:1}}
@keyframes swr{from{transform:translateX(-28px);opacity:.3}to{transform:none;opacity:1}}
#app.sw-l{animation:swl .22s ease-out}#app.sw-r{animation:swr .22s ease-out}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

body:has(#inputbar:not([hidden])) #app{padding-bottom:calc(var(--safe-b) + 190px)}
body:has(#fab:not([hidden])) #app{padding-bottom:calc(max(10px,calc(var(--safe-b) - 12px)) + 160px)}
.install{position:fixed;inset:0;z-index:100;background:var(--bg);overflow:auto;padding:calc(var(--safe-t) + 48px) 24px calc(var(--safe-b) + 32px)}
.install .in-wrap{max-width:420px;margin:0 auto;text-align:center}
.install .in-ico{width:88px;height:88px;border-radius:22px;margin-bottom:20px}
.install h1{font-size:28px;margin:0 0 10px}
.install ol{list-style:none;padding:0;margin:28px 0;text-align:left;display:grid;gap:12px}
.install li{background:var(--card);border-radius:18px;padding:16px;display:flex;gap:12px;align-items:center;line-height:1.35}
.install li svg{vertical-align:-4px;color:var(--acc,#FF5A4E)}
.install .n{flex:none;width:28px;height:28px;border-radius:50%;background:#fff;color:#0B0E14;font-weight:700;display:grid;place-items:center}
.install li .mut{display:block;font-size:14px;margin-top:2px}
.install .btn{width:100%}
.install .mut{color:var(--hint)}

html,body{overflow-x:hidden;overflow-x:clip;max-width:100%}
input,select,textarea{font-size:max(16px,1em)}
.inp{min-width:0;max-width:100%;text-overflow:ellipsis}

/* главный экран без прокрутки */
.hfit{gap:10px}
.hfit>*{flex:none}
.hfit .hmap{padding:12px;gap:10px}
.hfit .hpic{width:100%;display:block}
.hfit .hpic>img{width:100%;height:auto;aspect-ratio:780/720;object-fit:contain;display:block}
.hfit .quest{min-height:40px;padding:2px 4px}
.hfit .quest .small{font-size:11.5px}
.hfit .btn{height:48px;flex:none}
.hfit .h1{font-size:23px;white-space:nowrap}
.hfit .row>.grow{min-width:0}
.hfit .hside>.tile{padding:5px 10px!important}
.hfit .hside>button{padding:6px 10px!important}
@media (max-height:720px){.hfit .quest .small{display:none}.hfit .quest{min-height:34px}.hfit .hside>.tile{display:none}.hfit .hside{justify-content:center!important}}
@media (max-height:760px){.hfit .hpic{width:84%;margin:0 auto}}
@media (max-height:680px){.hfit .hpic{width:66%}}
@media (max-height:760px){.hfit .hside{gap:4px!important}.hfit .hside>.tile{padding:3px 10px!important}.hfit .hside .tiny{display:none}.hfit{gap:8px}}
@media (max-height:680px){.hfit .quest{min-height:32px}.hfit .hq{padding-top:6px!important}}
.tile.wu{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:64px;text-align:center;width:100%;border:1.5px solid transparent;transition:background .15s,border-color .15s}
.tile.wu.on{background:rgba(74,222,128,.12);border-color:rgba(74,222,128,.55)}
.tile.wu.on b{color:var(--green)}
.tile.wu .wuck{position:absolute;top:4px;right:8px;font-size:12px;color:var(--green);font-weight:700}
.wbox{flex:1;display:flex;align-items:baseline;justify-content:center;gap:4px;min-width:96px;padding:0 4px;cursor:text}
.wbox span{font-size:12px;color:var(--hint)}
.winp{min-width:1.2em;max-width:4em;height:44px;border:0;background:transparent;outline:none;text-align:center;font-size:22px;font-weight:700;line-height:normal;padding:0;color:var(--text);caret-color:var(--acc)}
.wbox:focus-within{background:var(--card2);border-radius:10px}
.inp{line-height:normal}
.upchip{background:var(--xp);color:var(--bg);height:32px;padding:0 10px;flex:none}
/* экран упражнения: всё на один экран, кнопки всегда видны */
.sfoot{position:sticky;bottom:calc(var(--safe-b) + 8px);z-index:5;margin-top:2px;padding-top:6px}
.sfoot::before{content:"";position:absolute;left:-16px;right:-16px;top:-14px;bottom:calc(-1 * var(--safe-b) - 8px);background:linear-gradient(transparent,var(--bg) 40%);z-index:-1}
.scard .bodyv{flex:none}
.tile.wu{min-height:52px;padding:6px}
.wgrid{grid-template-columns:repeat(auto-fit,minmax(0,1fr))}
body.notabs #app .setrow{padding:6px 10px}
body.notabs #app .reps{height:42px}
.mq{overflow:hidden;white-space:nowrap;margin:0}
.mq>span{display:inline-block;will-change:transform}
.mq.fade{-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.sfoot{grid-template-columns:1fr 1.65fr}
.sfoot .btn{white-space:nowrap;padding:0 12px}
#rotmsg{display:none}
body.landscape #rotmsg{display:flex;position:fixed;inset:0;z-index:200;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;color:var(--text)}
body.landscape #rotmsg span{color:var(--hint);font-size:14px}
body.landscape #rotmsg svg{color:var(--acc);animation:rotph 1.6s ease-in-out infinite}
@keyframes rotph{0%,30%{transform:rotate(-90deg)}60%,100%{transform:rotate(0)}}
.homebtn{width:52px;height:52px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:#fff;box-shadow:0 4px 16px rgba(255,90,78,.35);transition:transform .2s}
.homebtn:active{transform:scale(.92)}
.homebtn .ico{width:24px;height:24px;stroke-width:1.9}

#fab{position:fixed;right:max(20px,calc(50% - 240px));bottom:calc(max(10px,calc(var(--safe-b) - 12px)) + 80px);z-index:18;width:56px;height:56px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(255,90,78,.45);transition:transform .2s}
#fab:active{transform:scale(.9)}
#fab[hidden]{display:none}
.inputbar:not([hidden]){animation:fabin .22s cubic-bezier(.2,.8,.2,1)}
@keyframes fabin{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
body.kbopen #tabbar,body.kbopen #fab{display:none}
body.kbopen .inputbar{bottom:var(--kb,0px);padding-bottom:8px;background:var(--bg)}

'use strict';

/* ---------- Мелочи ---------- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => dstr(new Date());
const addDays = (d, n) => { const x = parseD(d); x.setDate(x.getDate() + n); return dstr(x); };
const mondayOf = d => { const x = parseD(d); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return dstr(x); };
const dow = d => parseD(d).getDay();
const nowHM = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = v => { if (typeof v === 'number') return v; const n = parseFloat(String(v == null ? '' : v).replace(',', '.').replace(/[^\d.\-]/g, '')); return isNaN(n) ? null : n; };
const r1 = v => Math.round(v * 10) / 10;
const fmt = v => v == null ? '—' : String(Math.round(v * 100) / 100).replace('.', ',');
const fmtInt = v => Math.round(v).toLocaleString('ru-RU');
const signed = v => { const r = Math.round(v * 10) / 10; return (r > 0 ? '+' : r < 0 ? '−' : '±') + fmt(Math.abs(r)); };
const norm = s => String(s).toLowerCase().replace(/ё/g, 'е').replace(/[«»"“”']/g, '').replace(/\s+/g, ' ').trim();
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = o => JSON.parse(JSON.stringify(o));
const WD = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
const WD_FULL = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'];
const MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const fmtDay = d => { const x = parseD(d); return WD_FULL[x.getDay()] + ', ' + x.getDate() + ' ' + MONTHS[x.getMonth()]; };
const fmtShort = d => d.slice(8, 10) + '.' + d.slice(5, 7);
const plural = (n, a, b, c) => { const m = Math.abs(n) % 100, k = m % 10; return m > 10 && m < 20 ? c : k === 1 ? a : k >= 2 && k <= 4 ? b : c; };

const LS = {
  get(k, d) { try { const v = localStorage.getItem('hd_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('hd_' + k, JSON.stringify(v)); } catch (e) { console.warn('storage', e); } },
  del(k) { try { localStorage.removeItem('hd_' + k); } catch (e) {} },
};

/* ---------- Состояние приложения ---------- */
const cfg = Object.assign({ api: '', key: '', faceId: false, cred: null, accent: '#FF5A4E', lastSync: 0 }, LS.get('cfg', {}));
const saveCfg = () => LS.set('cfg', cfg);

const DB = {
  prof: LS.get('prof', null),             // профиль и норма
  srv: LS.get('srv', {}),                 // настройки из таблицы (стакан, цель шагов…)
  prods: LS.get('prods', []),             // база продуктов
  food: LS.get('food', []),               // записи еды за последние недели
  hist: LS.get('hist', []),               // суммы КБЖУ по дням
  water: LS.get('water', {}),             // дата → мл
  steps: LS.get('steps', {}),             // дата → шаги
  weights: LS.get('weights', []),         // [{d, v}]
  kv: LS.get('kv', {}),                   // тренировки: ключ → {v, t}
  kvSince: LS.get('kvSince', 0),
  queue: LS.get('queue', []),             // изменения, ещё не отправленные в таблицу
};
const persist = (...keys) => keys.forEach(k => LS.set(k, DB[k]));

/* ---------- Синхронизация с Google-таблицей ---------- */
const SYNC = { busy: false, err: '', timer: null, listeners: [] };
const online = () => navigator.onLine !== false;
const hasApi = () => /^https:\/\/script\.google\.com\//.test(cfg.api) && !!cfg.key;

async function api(action, data = {}, timeout = 30000) {
  const ctrl = new AbortController(), t = setTimeout(() => ctrl.abort(), timeout);
  try {
    const res = await fetch(cfg.api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ key: cfg.key, action }, data)), signal: ctrl.signal, redirect: 'follow' });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error === 'auth' ? 'Неверный ключ доступа' : (j.error || 'Ошибка сервера'));
    return j;
  } finally { clearTimeout(t); }
}

function enqueue(type, d) {
  // повторная запись того же ключа тренировок заменяет предыдущую, ещё не отправленную
  if (type === 'kv.put' || type === 'kv.del') DB.queue = DB.queue.filter(o => !(o.type.startsWith('kv.') && o.d.k === d.k && !o.sent));
  DB.queue.push({ uid: uid(), type, d });
  persist('queue');
  scheduleSync(1500);
}

function scheduleSync(ms = 0) {
  clearTimeout(SYNC.timer);
  SYNC.timer = setTimeout(() => syncNow(), ms);
}

async function syncNow() {
  if (!hasApi() || SYNC.busy || !online()) return false;
  SYNC.busy = true; notifySync();
  const ops = DB.queue.slice(0, 200);
  try {
    const r = ops.length ? await api('push', { ops, kvSince: DB.kvSince, days: 21 }) : await api('pull', { kvSince: DB.kvSince, days: 21 });
    const sent = new Set(ops.map(o => o.uid));
    DB.queue = DB.queue.filter(o => !sent.has(o.uid));
    applyPull(r);
    DB.queue.forEach(applyLocal);          // то, что добавили, пока шёл запрос
    persist('queue');
    SYNC.err = ''; cfg.lastSync = Date.now(); saveCfg();
    SYNC.busy = false; notifySync(true);
    if (DB.queue.length) scheduleSync(300);
    return true;
  } catch (e) {
    SYNC.err = online() ? String(e.message || e) : 'нет интернета';
    SYNC.busy = false; notifySync();
    return false;
  }
}
const notifySync = changed => SYNC.listeners.forEach(f => { try { f(changed); } catch (e) { console.error(e); } });

function applyPull(r) {
  DB.srv = r.settings || DB.srv;
  if (r.products) DB.prods = r.products;
  const keepOld = DB.food.filter(e => e.date < r.foodFrom);
  DB.food = keepOld.concat(r.food || []);
  DB.hist = r.hist || DB.hist;
  DB.water = {}; (r.water || []).forEach(x => { DB.water[x.d] = x.v; });
  DB.steps = {}; (r.steps || []).forEach(x => { DB.steps[x.d] = x.v; });
  DB.weights = r.weights || DB.weights;
  let trainChanged = false;
  (r.kv || []).forEach(x => {
    const loc = DB.kv[x.k];
    if (!loc || loc.t < x.t) { DB.kv[x.k] = { v: x.v, t: x.t }; trainChanged = true; }
    if (x.t > DB.kvSince) DB.kvSince = x.t;
  });
  // профиль из таблицы, если он новее
  try {
    const sp = DB.srv.profile ? JSON.parse(DB.srv.profile) : null;
    if (sp && (!DB.prof || (sp.t || 0) > (DB.prof.t || 0))) DB.prof = sp;
  } catch (e) {}
  persist('srv', 'prods', 'food', 'hist', 'water', 'steps', 'weights', 'kv', 'kvSince', 'prof');
  if (trainChanged) loadTraining();
  rebuildProducts();
}

// применить операцию к локальным данным (сразу, ещё до отправки)
function applyLocal(op) {
  const d = op.d;
  switch (op.type) {
    case 'food.add': if (!DB.food.some(e => e.id === d.id)) DB.food.push(Object.assign({}, d)); break;
    case 'food.del': DB.food = DB.food.filter(e => e.id !== d.id); break;
    case 'food.edit': { const e = DB.food.find(x => x.id === d.id); if (e) { const k = d.grams / (e.grams || 1); Object.assign(e, { grams: d.grams, kcal: Math.round(e.kcal * k), p: r1(e.p * k), f: r1(e.f * k), c: r1(e.c * k) }); } break; }
    case 'weight.set': DB.weights = DB.weights.filter(w => w.d !== d.date).concat([{ d: d.date, v: d.kg }]).sort((a, b) => a.d < b.d ? -1 : 1); break;
    case 'weight.del': DB.weights = DB.weights.filter(w => w.d !== d.date); break;
    case 'water.add': DB.water[d.date] = Math.max(0, (DB.water[d.date] || 0) + d.ml); break;
    case 'product.add': if (!DB.prods.some(p => norm(p.name) === norm(d.name))) { DB.prods.push(d); rebuildProducts(); } break;

const NUMW = { 'один': 1, 'одна': 1, 'одно': 1, 'два': 2, 'две': 2, 'три': 3, 'четыре': 4, 'пять': 5, 'шесть': 6, 'семь': 7, 'восемь': 8, 'девять': 9, 'десять': 10, 'пол': 0.5, 'половина': 0.5, 'полтора': 1.5, 'полторы': 1.5 };

function parseFood(text) {

  const p = Math.round(w * pk);

    `Расход за день: ${fmtInt(bmr)} × ${String(pr.act).replace('.', ',')} = ${fmtInt(tdee)} ккал`,

    if (prev && e.w != null && prev.w != null && (e.w > prev.w || (e.w === prev.w && repsSum(e) > repsSum(prev)))) growth++;

      if (best > 0 && e1rm(e.w, e.r[0]) > best) recNames.push((NAMES[k] || 'упражнение') + ' ' + fmt(e.w) + ' × ' + e.r[0]);
    }
  }
  items.push({ t: 'Тренировка завершена', xp: 40 });
  if (growth) items.push({ t: `Вес или повторы выросли: ${growth} × 5`, xp: growth * 5 });
  recNames.forEach(n => items.push({ t: 'Рекорд: ' + n, xp: 20 }));

    const g = exGroup(NAMES[k] || ''); if (!g || g === 'cardio') continue;
    (s.h || []).forEach(e => { (groupDays[g] ||= new Set()).add(e.d); });
  }
  const weekWork = {}, weekCount = {};
  tdays.forEach(d => {
    const wk = mondayOf(d), lag = [];
    for (const [g, set] of Object.entries(groupDays)) {
      if (!set.has(d)) continue;
      const before = [...set].filter(x => x < d);
      if (!before.length) continue;
      const firstThisWeek = ![...set].some(x => x >= wk && x < d);
      const recent = before.some(x => x >= addDays(d, -14));
      if (firstThisWeek && !recent) lag.push(GROUPS.find(x => x.id === g).name);
    }
    const items = workoutXP(d, { lag });
    const sum = items.reduce((a, b) => a + b.xp, 0);
    items.forEach(it => add(d, it.t, it.xp));
    weekCount[wk] = (weekCount[wk] || 0) + 1;
    weekWork[wk] = (weekWork[wk] || 0) + sum;
    if (weekCount[wk] === 3) add(d, 'Серия: 3 тренировки за неделю, +10%', Math.round(weekWork[wk] * 0.1));
    else if (weekCount[wk] > 3) add(d, 'Серия: +10%', Math.round(sum * 0.1));
  });
  Object.entries(DB.water).forEach(([d, v]) => { if (v >= G.water) add(d, 'Норма воды', 5); });
  // свои задания дня (креатин, витамины…) — по 3 XP
  const cqName = id => ((S.settings.quests || []).find(q => q.id === id) || {}).n || 'Задание';
  Object.entries(S.mon).forEach(([k, m]) => Object.entries(m.q || {}).forEach(([day, ids]) => ids.forEach(id => add(`${k.slice(0, 4)}-${k.slice(4)}-${pad(+day)}`, 'Задание: ' + cqName(id), 3))));
  DB.weights.forEach(w => add(w.d, 'Взвешивание', 2));
  // средний вес за неделю сдвинулся к цели (засчитывается за законченную неделю)
  const byWeek = {};
  DB.weights.forEach(w => { (byWeek[mondayOf(w.d)] ||= []).push(w); });
  const weeks = Object.keys(byWeek).sort(), goal = DB.prof && DB.prof.goal;
  for (let i = 1; i < weeks.length; i++) {
    const wk = weeks[i]; if (addDays(wk, 6) >= today()) continue;
    if (weeks[i - 1] !== addDays(wk, -7)) continue;
    const avg = a => a.reduce((s, x) => s + x.v, 0) / a.length;
    const diff = avg(byWeek[wk]) - avg(byWeek[weeks[i - 1]]);
    const okMove = goal === 'cut' ? diff < -0.05 : goal === 'bulk' ? diff > 0.05 : Math.abs(diff) <= 0.3;
    if (okMove && goal) add(byWeek[wk][byWeek[wk].length - 1].d, 'Средний вес недели сдвинулся к цели', 15);
  }
  let total = 0;
  Object.values(days).forEach(list => list.forEach(x => { total += x.xp; }));
  let L = 1, rest = total;
  while (rest >= need(L)) { rest -= need(L); L++; }
  const stage = stageFor(L);
  if (typeof CUR_STAGE !== 'undefined' && CUR_STAGE !== stage) { CUR_STAGE = stage; LS.set('stage', stage); }
  return { total, level: L, into: rest, need: need(L), title: titleFor(L), stage, days, tset, weekCount };
}

function computeStats(X) {
  const t = today(), from30 = addDays(t, -29), from14 = addDays(t, -13), G = goals();
  let growth = 0, recs = 0;
  Object.entries(X.days).forEach(([d, list]) => {
    if (d < from30) return;
    list.forEach(x => { if (/^Вес или повторы/.test(x.t)) growth += x.xp / 5; if (/^Рекорд/.test(x.t)) recs++; });
  });
  const strength = Math.min(100, 30 + growth * 4 + recs * 8);
  let waterDays = 0;
  for (let i = 0; i < 14; i++) if ((DB.water[addDays(t, -i)] || 0) >= G.water) waterDays++;
  const tr14 = [...X.tset].filter(d => d >= from14).length;
  const endurance = Math.round(60 * Math.min(1, tr14 / 8) + 40 * waterDays / 14);
  // дисциплина: доля выполненных заданий дня за 30 дней (с первого дня с данными)
  const first = [Object.keys(DB.water)[0], DB.weights[0] && DB.weights[0].d, [...X.tset][0]].filter(Boolean).sort()[0] || t;
  let doneQ = 0, allQ = 0;
  for (let d = first < from30 ? from30 : first; d <= t; d = addDays(d, 1)) {
    const plan = planFor(d);
    const cq = (S.settings.quests || []).length;
    allQ += 2 + (plan ? 1 : 0) + cq;
    if ((DB.water[d] || 0) >= G.water) doneQ++;
    doneQ += Math.min(cq, cqDone(d).length);
    if (DB.weights.some(w => w.d === d)) doneQ++;
    if (plan && X.tset.has(d)) doneQ++;
  }
  const discipline = allQ ? Math.round(doneQ / allQ * 100) : 0;
  return { strength: Math.round(strength), endurance, discipline };
}

function weekMuscles() {

const TG = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData ? window.Telegram.WebApp : null;
async function importFromTelegram(force) {
  if (!TG || !TG.CloudStorage || !(TG.isVersionAtLeast && TG.isVersionAtLeast('6.9'))) return 0;

  for (let i = 0; i < keys.length; i += 50) Object.assign(items, await new Promise(r => cs.getItems(keys.slice(i, i + 50), (e, v) => r(e ? {} : (v || {})))));

// аккуратное обновление DOM без пересоздания узлов
function morphKids(a, b) {
  const an = [...a.childNodes], bn = [...b.childNodes];
  for (let i = 0; i < bn.length; i++) {
    const x = an[i], y = bn[i];
    if (!x) { a.appendChild(y); continue; }
    morphNode(x, y);
  }
  for (let i = bn.length; i < an.length; i++) an[i].remove();
}
function morphNode(x, y) {
  if (x.nodeType !== y.nodeType || x.nodeName !== y.nodeName) { x.replaceWith(y); return; }
  if (x.nodeType === 3 || x.nodeType === 8) { if (x.nodeValue !== y.nodeValue) x.nodeValue = y.nodeValue; return; }
  if (x.nodeType !== 1) return;
  for (const at of [...x.attributes]) if (!y.hasAttribute(at.name)) x.removeAttribute(at.name);
  for (const at of [...y.attributes]) if (x.getAttribute(at.name) !== at.value) x.setAttribute(at.name, at.value);
  if (x.tagName === 'INPUT' || x.tagName === 'TEXTAREA' || x.tagName === 'SELECT') {
    if (document.activeElement !== x) {
      if (x.type === 'checkbox' || x.type === 'radio') x.checked = y.hasAttribute('checked');
      else if (x.tagName === 'SELECT') { morphKids(x, y); const s = y.querySelector('option[selected]'); x.value = s ? s.value : (y.options[0] || {}).value; return; }
      else x.value = x.tagName === 'TEXTAREA' ? y.textContent : (y.getAttribute('value') || '');
    }
    if (x.tagName !== 'TEXTAREA') return;
    return;
  }
  morphKids(x, y);
}

// бегущая строка для длинных названий: стоит 5 с → прокручивается по кругу один раз → снова стоит 5 с
function setupMarquee(force) {
  document.querySelectorAll('#app .mq').forEach(box => {
    const t = box.firstElementChild; if (!t) return;
    const txt = t.querySelector('[aria-hidden]') ? t.dataset.txt : t.textContent;
    t.dataset.txt = txt;
    const one = document.createElement('span'); one.textContent = txt; one.style.cssText = 'position:absolute;visibility:hidden;white-space:nowrap';
    box.appendChild(one); const w = Math.ceil(one.getBoundingClientRect().width); one.remove();
    const key = txt + '|' + w + '|' + box.clientWidth, long = w > box.clientWidth + 2;
    if (!force && box.dataset.key === key && (!long || t.querySelector('[aria-hidden]'))) return;
    box.dataset.key = key;
    if (t._anim) { t._anim.cancel(); t._anim = null; }
    box.classList.toggle('fade', long);
    if (!long || matchMedia('(prefers-reduced-motion: reduce)').matches) { t.textContent = txt; return; }
    const gap = 48;
    t.innerHTML = `${esc(txt)}<span style="display:inline-block;width:${gap}px"></span><span aria-hidden="true">${esc(txt)}</span>`;
    const dist = w + gap, run = Math.max(3, dist / 40), hold = 5, total = hold + run;
    t._anim = t.animate([
      { transform: 'translateX(0)', offset: 0 },
      { transform: 'translateX(0)', offset: hold / total, easing: 'linear' },
      { transform: `translateX(${-dist}px)`, offset: 1 }
    ], { duration: total * 1000, iterations: Infinity });
  });
}

function writeEntry(fn) {
  const day = sessionDay(), e = day.ex[Math.min(ui.sIdx, day.ex.length - 1)], key = exKey(e), s = st(key), t = today();

  if (!te) { te = { d: t, w: e.k === 'c' ? null : s.w, r: [] }; if (e.sc === 'ts') { te.ts = 1; te.bk = tsBack(e, s); } (s.h ||= []).push(te); }
  fn(te, e, s);
  while (te.r.length && (te.r[te.r.length - 1] == null || te.r[te.r.length - 1] === '')) te.r.pop();
  if (!te.r.length && !(e.sc === 'ts')) { s.h = s.h.filter(x => x !== te); }
  else if (e.sc === 'ts' && te.r[0] == null && te.r[1] == null) { s.h = s.h.filter(x => x !== te); }

/* ---------- Таймер отдыха ---------- */
const REST = { end: 0, total: 0, tick: null };
function parseRest(t) { const n = parseInt((String(t || '').match(/\d+/) || [])[0], 10); if (!n) return 90; return /мин/.test(t) && !/сек/.test(t) ? n * 60 : n; }
function startRest(sec) {
  if (S.settings.timer === false) return;
  REST.total = sec; REST.end = Date.now() + sec * 1000; REST.done = false;
  LS.set('rest', { end: REST.end, total: REST.total });
  showRest();
  if (S.settings.lockTimer) restToLock();
}
function showRest() { $('#timer').hidden = false; document.body.classList.add('timing'); clearInterval(REST.tick); REST.tick = setInterval(tickRest, 250); tickRest(); }
// таймер переживает блокировку и перезапуск приложения
function restoreRest() {
  const r = LS.get('rest', null);
  if (!r || !r.end) return;
  if (r.end > Date.now()) { REST.end = r.end; REST.total = r.total; REST.done = false; showRest(); }
  else if (Date.now() - r.end < 10 * 60e3) { LS.set('rest', null); toast('Отдых окончен — следующий подход'); }
  else LS.set('rest', null);
}
function tickRest() {
  const left = Math.max(0, Math.round((REST.end - Date.now()) / 1000));
  $('#tLeft').textContent = Math.floor(left / 60) + ':' + pad(left % 60);
  $('#tBar').style.width = (100 - left / REST.total * 100) + '%';
  if (left <= 0 && !REST.done) {
    REST.done = true;
    // если приложение было свёрнуто, сигнал уже не к месту — только подсказка
    const late = Date.now() - REST.end > 2500;
    stopRest(); toast('Отдых окончен — следующий подход');
    if (!late && S.settings.restSound !== false) beep3();
  }
}
function stopRest() { clearInterval(REST.tick); $('#timer').hidden = true; document.body.classList.remove('timing'); LS.set('rest', null); }
// отправить таймер в системные «Часы»: обратный отсчёт на экране блокировки и сигнал
function restToLock() {
  const left = Math.max(1, Math.round((REST.end - Date.now()) / 1000));
  location.href = 'shortcuts://run-shortcut?name=' + encodeURIComponent('Отдых') + '&input=text&text=' + left;
}

/* ---------- звуковой сигнал: 3 секунды коротких сигналов ---------- */
let AC = null;
function audioUnlock() {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    // «разогрев» — тихий щелчок, чтобы iOS разрешил звук позже
    const o = AC.createOscillator(), g = AC.createGain(); g.gain.value = 0.0001; o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime + 0.02);
  } catch (e) {}
}
function beep3() {
  try {
    if (!AC) return;
    try { if (navigator.audioSession) navigator.audioSession.type = 'transient'; } catch (e) {}
    if (AC.state === 'suspended') AC.resume();
    const t0 = AC.currentTime + 0.05;
    for (let i = 0; i < 6; i++) {
      const o = AC.createOscillator(), g = AC.createGain(), t = t0 + i * 0.5;
      o.type = 'sine'; o.frequency.value = i % 2 ? 1046 : 880;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.6, t + 0.02);
      g.gain.setValueAtTime(0.6, t + 0.26); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
      o.connect(g).connect(AC.destination); o.start(t); o.stop(t + 0.34);
    }
    setTimeout(() => { try { if (navigator.audioSession) navigator.audioSession.type = 'auto'; } catch (e) {} }, 3300);
  } catch (e) {}
}

async function submitFood(text) {
  text = String(text || '').trim(); if (!text) return;
  const d = ui.foodDate || today(), low = norm(text);
  if (/^(итог|итоги|что осталось|остаток)$/.test(low)) { const t = sumFood(foodOf(d)), G = goals(); toast(`Итог: ${fmtInt(t.kcal)} / ${fmtInt(G.kcal)} ккал · осталось ${fmtInt(G.kcal - t.kcal)}\nБ ${Math.round(t.p)}/${G.p} · Ж ${Math.round(t.f)}/${G.f} · У ${Math.round(t.c)}/${G.c}`, 5000); return true; }
  if (/^(удали|удалить|отмени|отменить)( последнее| последнюю| последний)?( запись)?$/.test(low)) {
    const last = foodOf(d).slice(-1)[0];
    if (!last) { toast('За этот день нет записей'); return true; }
    act('food.del', { id: last.id }); render(); toast('Удалил: ' + last.name + ' ' + fmt(last.grams) + ' г'); return true;
  }
  const calc = low.match(/^(сколько в|сколько|посчитай|хочу съесть|хочу)\s+(.+)$/);

  let r = resolveFood(src);
  if (r.unknown.length) {

    const lk = await lookupUnknown(r.unknown);
    const r2 = resolveFood(src);
    r = { meal: r2.meal, items: r2.items, errors: r2.errors.concat(lk.errors), unknown: [] };
  }

/* =====================================================================

function progressScreen() {
  const X = computeXP(), ST = computeStats(X), pct = Math.round(X.into / X.need * 100);
  const sel = ui.stageSel == null ? X.stage - 1 : ui.stageSel;
  const DESC = ['Старт. Обычное тело, первые тренировки и привычка вносить еду, воду и вес.', 'Появился тонус: плечи и грудь заметнее, тренировки идут по плану.', 'Спортивная фигура: виден пресс, руки и ноги в рельефе.', 'Сухой рельеф: каждая мышца прорисована, рабочие веса уверенно растут.', 'Мощная масса: широкие плечи, большая спина и ноги.', 'Вершина: максимальная масса и прорисовка. Все награды открыты.'];
  const ranges = ['ур. 1–4', 'ур. 5–9', 'ур. 10–14', 'ур. 15–19', 'ур. 20–29', 'ур. 30+'];
  const ws = DB.weights.filter(w => w.d >= addDays(today(), -89));
  let chart = '<div class="small">Записей веса пока нет</div>';
  if (ws.length > 1) {
    const vs = ws.map(w => w.v), mn = Math.min(...vs) - .3, mx = Math.max(...vs) + .3, W = 340, Hh = 110;
    const x0 = parseD(ws[0].d), span = Math.max(1, (parseD(ws[ws.length - 1].d) - x0) / 864e5);
    const pts = ws.map(w => [((parseD(w.d) - x0) / 864e5) / span * (W - 16) + 8, Hh - 10 - (w.v - mn) / (mx - mn) * (Hh - 24)]);
    chart = `<svg class="wchart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="График веса"><polyline points="${pts.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="var(--acc)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>${pts.map((p, i) => i === pts.length - 1 ? `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="var(--acc)"/>` : '').join('')}<text x="8" y="12" fill="#8B93A7" font-size="11">${fmt(Math.max(...vs))}</text><text x="8" y="${Hh - 2}" fill="#8B93A7" font-size="11">${fmt(Math.min(...vs))}</text></svg>
      <div class="between small"><span>${fmtShort(ws[0].d)} · ${fmt(ws[0].v)} кг</span><span>${fmtShort(ws[ws.length - 1].d)} · ${fmt(ws[ws.length - 1].v)} кг (${signed(ws[ws.length - 1].v - ws[0].v)})</span></div>`;
  }
  const tr30 = [...X.tset].filter(d => d >= addDays(today(), -29)).length;
  return `<div class="col">
  <div><div class="eyebrow">Рост персонажа</div><h1 class="h1">Уровень ${X.level} · ${X.title}</h1></div>
  <div class="card col" style="gap:6px"><div class="between" style="font-size:13px"><b style="color:var(--xp)">${X.into} / ${X.need} XP</b><span class="sub">всего ${fmtInt(X.total)} XP</span></div><div class="xpbar"><i style="width:${pct}%"></i></div></div>
  <div class="grid3">${TITLES.map(([lv, name], i) => `<button class="stage ${i === X.stage - 1 ? 'cur' : ''} ${i === sel ? 'sel' : ''} ${i > X.stage - 1 ? 'locked' : ''}" data-a="stage" data-i="${i}">
    <span style="position:relative;width:100%;height:118px;border-radius:12px;background:var(--card2);display:flex;align-items:flex-end;justify-content:center;margin-bottom:4px;overflow:hidden;padding-top:6px"><img src="${HERO()}_${i + 1}_f.webp" alt="" decoding="sync" style="height:110px;width:auto;aspect-ratio:${FEM() ? '174/420' : '208/420'};display:block;${i > X.stage - 1 ? 'filter:grayscale(1) brightness(.35)' : ''}">${i > X.stage - 1 ? `<span style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">${ic('lock', 'ico', 'style="color:var(--hint)"')}</span>` : ''}</span>
    <b style="font-size:13px">${name}</b><span class="tiny">${ranges[i]}</span></button>`).join('')}</div>
  <div class="card col" style="gap:8px"><div class="between"><b style="font-size:17px">${TITLES[sel][1]}</b><span class="small">${ranges[sel]}</span></div>
    <div style="position:relative;width:100%;max-width:420px;margin:0 auto;aspect-ratio:${HERO_AR()}">${TITLES.map((t, i) => `<img src="${HERO()}_${i + 1}.webp" alt="${i === sel ? 'Персонаж: ' + t[1] : ''}" decoding="sync" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;opacity:${i === sel ? 1 : 0};${i > X.stage - 1 ? 'filter:grayscale(1) brightness(.4)' : ''}">`).join('')}</div>
    <span class="small" style="color:#C3C9D6;line-height:1.45">${DESC[sel]}${sel > X.stage - 1 ? ` Откроется на ${TITLES[sel][0]} уровне — ещё ${fmtInt(xpToLevel(TITLES[sel][0]) - X.total)} XP.` : ''}</span></div>
  <div class="card col" style="gap:8px"><span class="label">Вес · 90 дней</span>${chart}</div>
  <div class="card col" style="gap:8px"><span class="label">Характеристики</span>
    <div class="row small"><b style="width:118px;color:var(--text)">Сила ${ST.strength}</b><span class="grow">прибавки веса и рекорды за 30 дней</span></div>
    <div class="row small"><b style="width:118px;color:var(--text)">Выносливость ${ST.endurance}</b><span class="grow">тренировки и норма воды за 14 дней</span></div>
    <div class="row small"><b style="width:118px;color:var(--text)">Дисциплина ${ST.discipline}</b><span class="grow">выполненные задания дня за 30 дней</span></div>
    <div class="row small"><b style="width:118px;color:var(--text)">Тренировок ${tr30}</b><span class="grow">за последние 30 дней</span></div>
  </div>
  <button class="btn ghost" data-a="go" data-to="xp">Как начисляется XP ›</button>
  </div>`;
}

function startSession(pid, wi, n) {
  ui.sIdx = 0; ui.tips = false;
  const d = P[pid] && P[pid].weeks[wi] && P[pid].weeks[wi].d[n];
  if (d) { const first = d.ex.findIndex(e => exState(e) !== 'done'); ui.sIdx = first < 0 ? 0 : first; }
  go('session', { pid, wi, n });
}

  wval: el => { el.style.width = wch(el.value || el.placeholder) + 'em'; },

  'dr-reps': el => { const m = el.value.match(/(\d+)\s*(?:[-–]\s*(\d+))?/); if (m) { const e = ui.draft.ex[+el.dataset.i]; e.r = [+m[1], +(m[2] || m[1])]; } },
  'dr-min': el => { const n = parseInt(el.value, 10); if (n > 0) ui.draft.ex[+el.dataset.i].m = n; },
  pd: el => { profileDraft()[el.dataset.k] = el.value; },
};
// значения, после которых нужен перерасчёт экрана (на change, а не на каждую букву)
const CHG = {
  wval: el => {
    const v = num(el.value), d = sessionDay(), e = d.ex[ui.sIdx], s = st(exKey(e));
    if (v == null || v < 0 || v > 1000) { el.value = fmt(s.w); return; }
    s.w = isStack(e) ? snapW(e, v) : r1(v); if (e.sc === 'ts') s.bk = null;
    const te = todayEntry(s); if (te) { te.w = s.w; if (e.sc === 'ts') te.bk = tsBack(e, s); }
    kvSave(exKey(e), s); el.blur(); render();
    if (isStack(e) && s.w !== r1(v)) toast('На блоке нет ' + fmt(v) + ' кг — поставил ' + fmt(s.w) + ' кг');
  },
  pd: () => { patch(['#normbox']); const pd = profileDraft(), b = document.querySelector('[data-a="pd-save"]'); if (b) b.disabled = !calcNorm({ ...pd, weight: num(pd.weight), height: num(pd.height), age: num(pd.age) }); },
  set: el => {
    const j = +el.dataset.j, v = el.value === '' ? null : parseInt(el.value, 10);
    const { e } = writeEntry(te => { te.r[j] = isNaN(v) ? null : v; for (let k = 0; k < j; k++) if (te.r[k] === undefined) te.r[k] = null; });
    patch(['#sextra', '#sdots', '#sfoot']); if (v != null) startRest(parseRest(e.t));
  },
  ts: el => {
    const j = +el.dataset.j, v = el.value === '' ? null : parseInt(el.value, 10);
    const { e } = writeEntry((te, ex, s) => { te.w = s.w; te.bk = tsBack(ex, s); te.r[j] = isNaN(v) ? null : v; if (j === 1 && te.r[0] === undefined) te.r[0] = null; });
    patch(['#sextra', '#sdots', '#tss0', '#tsc0', '#tss1', '#tsc1', '#sxp', '#sfoot']); if (v != null) startRest(parseRest(e.t));
  },
  cardio: el => { const v = el.value === '' ? null : parseInt(el.value, 10); writeEntry(te => { te.w = null; te.r = v == null || isNaN(v) ? [] : [v]; }); patch(['#sextra', '#sdots']); },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (el && !el.disabled) { const fn = A[el.dataset.a]; if (fn) { e.preventDefault(); fn(el, e); } return; }
  const tb = e.target.closest('#tabbar button');
  if (tb) { ui.stack = []; if (tb.dataset.tab === 'food') ui.foodDate = null; go(tb.dataset.tab, {}, false); }
  if (e.target.id === 'sheet') closeSheet();
});
document.addEventListener('input', e => { const el = e.target, k = el.dataset && el.dataset.in; if (k && IN[k]) IN[k](el); });
document.addEventListener('focusin', e => { const el = e.target; if (el.classList && el.classList.contains('winp')) { el.placeholder = el.value; el.value = ''; IN.wval(el); } });
document.addEventListener('focusout', e => { const el = e.target; if (el.classList && el.classList.contains('winp') && el.value === '') { el.value = el.placeholder; IN.wval(el); } });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('winp')) e.target.blur(); });
document.addEventListener('change', e => { const el = e.target, k = el.dataset && el.dataset.in; if (k && CHG[k]) CHG[k](el); });
document.addEventListener('submit', async e => {
  if (e.target.id !== 'inputbar') return;
  e.preventDefault();
  const i = $('#ftext'), txt = i.value;
  i.blur();
  const ok = await submitFood(txt);
  if (ok) { i.value = ''; ui.fopen = false; render(); }
});

  if (n) { ui.stack = n.stack || []; ui.sIdx = n.sIdx || 0; go(n.screen, n.params || {}, false); return; }
  go('hero', {}, false);
}
function unlocked() { LOCKED = false; ui.stack = []; homeScreen(); }

// заранее загружаем и декодируем всех персонажей, чтобы переключение было мгновенным
const IMG_CACHE = [];
function preloadImages() {
  const hp = FEM() ? 'herof' : 'hero', bp = FEM() ? 'bodyf' : 'body';
  for (let n = 1; n <= 6; n++) [hp + '_' + n, hp + '_' + n + '_f', bp + '_' + n + '_front', bp + '_' + n + '_back'].forEach(f => {
    const im = new Image(); im.src = f + '.webp'; im.decode && im.decode().catch(() => {}); IMG_CACHE.push(im);
  });
}
async function boot() {
  preloadImages();
  if (typeof DEMO_MODE !== 'undefined') demoSeed();
  applyAccent();
  rebuildProducts();
  loadTraining();
  if (TG) { try { TG.ready(); TG.expand(); TG.disableVerticalSwipes && TG.disableVerticalSwipes(); } catch (e) {} }
  SYNC.listeners.push(changed => {
    // перерисовываем, только если пользователь сейчас ничего не вводит
    const ae = document.activeElement;
    if (changed && !(ae && /INPUT|TEXTAREA/.test(ae.tagName)) && $('#sheet').hidden && !LOCKED) render();
    else if (!changed) { const b = document.querySelector('[data-a="sync"]'); if (b) b.outerHTML = syncBadge(); }
  });
  if (cfg.faceId && !TG) { LOCKED = true; go('lock', {}, false); A.unlock(); }
  else homeScreen();
  restoreRest();
  if (hasApi()) await syncNow();
  if (TG) { try { const n = await importFromTelegram(); if (n) { toast('Перенёс тренировки из Telegram: ' + n); render(); } } catch (e) { console.warn(e); } }
  if (!Object.keys(P).length && cfg.setupDone) { seedPrograms(); if (!LOCKED) render(); }
  setInterval(() => { if (document.visibilityState === 'visible') scheduleSync(0); }, 60000);
}
window.addEventListener('online', () => scheduleSync(0));
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { hiddenAt = Date.now(); return; }
  if (cfg.faceId && !TG && hiddenAt && Date.now() - hiddenAt > (ui.screen === 'session' ? 3 * 3600e3 : 5 * 60e3) && !LOCKED) { LOCKED = true; go('lock', {}, false); A.unlock(); return; }
  scheduleSync(0);
  if (!LOCKED && ['hero', 'food'].includes(ui.screen)) render();   // мог смениться день
});
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  const hadSW = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    reg.update().catch(() => {});
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(e => console.warn('sw', e));
  // пришла новая версия — перезагружаемся сами, если пользователь ничего не вводит и не тренируется
  let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadSW || reloaded) return;
    const ae = document.activeElement, busy = (ae && /INPUT|TEXTAREA/.test(ae.tagName)) || ui.screen === 'session' || !$('#sheet').hidden;
    if (busy) { toast('Вышла новая версия — она включится при следующем открытии'); return; }
    reloaded = true; location.reload();
  });
}
function installGate() {
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
  if (!ios || standalone || TG || typeof DEMO_MODE !== 'undefined' || sessionStorage.getItem('hd_browser')) return;
  const d = document.createElement('div');
  d.className = 'install';
  d.innerHTML = `<div class="in-wrap">
    <img src="icon-180.png" alt="" class="in-ico">
    <h1>Установите «Героя»</h1>
    <p class="mut">Так приложение откроется на весь экран, без строки браузера, и будет работать без интернета.</p>
    <ol>
      <li><span class="n">1</span><div>Нажмите <b>«Поделиться»</b> <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M8 7l4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg> внизу Safari <span class="mut">(или «…» → «Поделиться»)</span></div></li>
      <li><span class="n">2</span><div>Выберите <b>«На экран Домой»</b></div></li>
      <li><span class="n">3</span><div>Откройте «Героя» <b>с иконки</b> на экране Домой</div></li>
    </ol>
    <button class="btn ghost" id="inSkip">Продолжить в браузере</button>
  </div>`;
  document.body.appendChild(d);
  d.querySelector('#inSkip').onclick = () => { sessionStorage.setItem('hd_browser', '1'); d.remove(); };
}
// свайпы: влево/вправо — соседний раздел; на внутренних экранах свайп от левого края — назад
(function swipes() {
  // экран едет за пальцем; отпустили — доезжает и плавно сменяется, или возвращается на место
  let sx = 0, sy = 0, st = 0, ok = false, dir = 0, dx = 0, busy = false;
  const app = () => $('#app');
  const blocked = el => el.closest('input,textarea,select,[contenteditable],#sheet,#timer,.install,.noswipe,#tabbar') ||
    [...(function* () { for (let n = el; n && n !== document.body; n = n.parentElement) yield n; })()].some(n => n.scrollWidth > n.clientWidth + 2 && /auto|scroll/.test(getComputedStyle(n).overflowX));
  // куда можно листать: -1 влево (следующий), +1 вправо (предыдущий)
  function target(d) {
    if (ui.screen === 'session') { const day = sessionDay(); if (!day) return null; const j = ui.sIdx + (d < 0 ? 1 : -1); return j >= 0 && j < day.ex.length ? { s: true, j } : null; }
    const i = TABS.indexOf(ui.screen);
    if (i >= 0) { const j = i + (d < 0 ? 1 : -1); return j >= 0 && j < TABS.length ? { t: TABS[j] } : null; }
    if (d > 0 && sx < 40 && ui.stack.length && !['lock', 'setup'].includes(ui.screen)) return { back: true };
    return null;
  }
  function apply(tg) {
    if (tg.s) { ui.sIdx = tg.j; ui.tips = false; render(); window.scrollTo(0, 0); }
    else if (tg.t) { ui.stack = []; if (tg.t === 'food') ui.foodDate = null; go(tg.t, {}, false); }
    else if (tg.back) goBack();
  }
  const setX = (x, ms, ease) => { const el = app(); el.style.transition = ms ? `transform ${ms}ms ${ease || 'cubic-bezier(.2,.8,.2,1)'}` : 'none'; el.style.transform = x ? `translate3d(${x}px,0,0)` : ''; };
  document.addEventListener('touchstart', e => {
    ok = false; dir = 0; dx = 0;
    if (busy || e.touches.length !== 1 || LOCKED || !$('#sheet').hidden || document.body.classList.contains('landscape')) return;
    const t = e.touches[0]; if (blocked(e.target)) return;
    sx = t.clientX; sy = t.clientY; st = Date.now(); ok = true;
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!ok) return;
    const t = e.touches[0], mx = t.clientX - sx, my = t.clientY - sy;
    if (!dir) {
      if (Math.abs(mx) < 10 && Math.abs(my) < 10) return;
      if (Math.abs(mx) < Math.abs(my) * 1.3) { ok = false; return; }   // это прокрутка вверх-вниз
      dir = 1;
    }
    dx = mx;
    const can = target(dx);
    setX(can ? dx : dx * 0.25);   // у края — сопротивление
  }, { passive: true });
  document.addEventListener('touchend', () => {
    if (!ok || !dir) { ok = false; return; }
    ok = false;
    const w = innerWidth, tg = target(dx), fast = Date.now() - st < 300 && Math.abs(dx) > 40;
    if (!tg || (Math.abs(dx) < w * 0.25 && !fast)) { setX(0, 220); return; }
    busy = true;
    const out = dx < 0 ? -w : w;
    setX(out, 160, 'ease-in');
    setTimeout(() => {
      apply(tg);
      setX(-out * 0.35, 0);
      requestAnimationFrame(() => requestAnimationFrame(() => { setX(0, 260); setTimeout(() => { busy = false; app().style.transition = ''; }, 270); }));
    }, 165);
  }, { passive: true });
  document.addEventListener('touchcancel', () => { if (ok && dir) setX(0, 200); ok = false; }, { passive: true });
})();

// звук разрешается только после касания — «разогреваем» его на каждом касании
document.addEventListener('touchend', () => { if (!AC || AC.state !== 'running') audioUnlock(); }, { passive: true });
document.addEventListener('click', () => { if (!AC || AC.state !== 'running') audioUnlock(); });

// iPhone не умеет запрещать поворот для приложений с экрана «Домой» — в альбомной ориентации просим повернуть обратно
function checkOrient() {
  const phone = Math.min(screen.width, screen.height) < 520;
  let land = false;
  try {
    if (screen.orientation && screen.orientation.type) land = screen.orientation.type.startsWith('landscape');
    else if (typeof window.orientation === 'number') land = Math.abs(window.orientation) === 90;
    else { const ae = document.activeElement; land = innerWidth > innerHeight && !(ae && /INPUT|TEXTAREA/.test(ae.tagName)); }
  } catch (e) {}
  document.body.classList.toggle('landscape', phone && land);
}
try { screen.orientation && screen.orientation.addEventListener('change', checkOrient); } catch (e) {}
window.addEventListener('orientationchange', () => setTimeout(checkOrient, 50));
window.addEventListener('resize', checkOrient);
checkOrient();

// клавиатура iPhone перекрывает нижние поля — поднимаем поле ввода над клавиатурой
(function keyboardLift() {
  const vv = window.visualViewport; if (!vv) return;
  const upd = () => {
    const kb = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
    const open = kb > 80;
    document.documentElement.style.setProperty('--kb', (open ? kb : 0) + 'px');
    document.body.classList.toggle('kbopen', open);
  };
  vv.addEventListener('resize', upd); vv.addEventListener('scroll', upd); upd();
})();

installGate();
boot();

</script>
