<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Дневник тренировок</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg: var(--tg-theme-secondary-bg-color, #eef0f3);
  --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #ffffff));
  --text: var(--tg-theme-text-color, #15171b);
  --hint: var(--tg-theme-hint-color, #8b909a);
  --accent: var(--tg-theme-button-color, #2d7ff9);
  --accent-text: var(--tg-theme-button-text-color, #ffffff);
  --danger: var(--tg-theme-destructive-text-color, #e5484d);
  --ok: #27ae60;
  --up: #e8912d;
  --w2: #8b5cf6;
  --line: color-mix(in srgb, var(--hint) 22%, transparent);
  --soft: color-mix(in srgb, var(--hint) 12%, transparent);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not(.tg){ --bg:#101216; --card:#1b1e24; --text:#eceef2; --hint:#7c828d; }
}
body{--wc: var(--accent)}
body[data-wc="2"]{--wc: var(--w2)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:"Onest",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.35;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 12px 8px}
.progs{display:flex;gap:6px;overflow-x:auto;margin:0 -12px 8px;padding:0 12px;scrollbar-width:none}
.progs::-webkit-scrollbar{display:none}
.pill{border:0;background:var(--card);border-radius:999px;padding:7px 13px;white-space:nowrap;font-size:13px;font-weight:500;flex:none}
.pill.on{background:var(--text);color:var(--bg)}
.pill.ico{width:34px;padding:7px 0;color:var(--accent);font-size:15px;font-weight:600}

.weeks{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.wk{border:1.5px solid transparent;background:var(--card);border-radius:10px;padding:5px 10px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;color:var(--hint)}
.wk[data-week="0"]{--c:var(--accent)} .wk[data-week="1"]{--c:var(--w2)}
.wk.on{border-color:var(--c);color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--card))}
.wk.now::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.wk small{font-size:11px;font-weight:500;color:var(--ok)}
.wk.ico{padding:5px 9px;color:var(--accent);font-size:14px}
.tgl{margin-left:auto;border:0;background:var(--card);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--hint);display:flex;align-items:center;gap:7px;white-space:nowrap}
.tgl .sw{width:30px;height:18px;border-radius:9px;background:var(--line);position:relative;transition:.2s}
.tgl .sw::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tgl.on{color:var(--text)}
.tgl.on .sw{background:var(--ok)}
.tgl.on .sw::after{left:14px}

.days{display:grid;gap:6px}
.day{border:0;background:var(--card);border-radius:12px;padding:8px 2px 7px;text-align:center;position:relative;min-width:0}
.day b{display:block;font-size:17px;font-weight:800}
.day small{display:block;font-size:11px;color:var(--hint);font-variant-numeric:tabular-nums}
.day.on{background:var(--wc);color:#fff}
.day.on small{color:#fff;opacity:.8}
.day.today::after{content:"";position:absolute;top:6px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--ok)}
.day.full small{color:var(--ok);font-weight:600}
.day.on.full small{color:#fff}

main{padding:4px 12px 24px;max-width:560px;margin:0 auto}
body.timing main{padding-bottom:110px}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:10px 2px 8px}
.dayhead h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-.01em}
.dayhead span{color:var(--hint);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.dayhead em{font-style:normal;color:var(--wc);font-weight:600}
.bar{height:4px;background:var(--soft);border-radius:2px;margin:0 2px 14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);transition:width .25s}

.ex{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px;border-left:4px solid transparent;transition:border-color .2s}
.ex.done{border-left-color:var(--ok)}
.ex.light{background:color-mix(in srgb,var(--card) 70%,var(--bg))}
.top{display:flex;gap:10px;align-items:flex-start}
.nm{flex:1;min-width:0}
.nm h3{margin:0;font-size:16px;font-weight:600}
.nm p{margin:2px 0 0;color:var(--hint);font-size:13px}
.rb{border:0;background:var(--soft);border-radius:6px;padding:0 6px;font-size:13px;color:var(--accent)}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--soft);color:var(--hint);margin-left:4px;vertical-align:1px;font-weight:500}
.tag.c{background:color-mix(in srgb,#e5484d 14%,transparent);color:#e5484d}

.chk{position:relative;width:32px;height:32px;flex:none}
.chk input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.chk span{position:absolute;inset:0;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;transition:.15s}
.chk input:checked+span{background:var(--ok);border-color:var(--ok)}
.chk input:checked+span::after{content:"";width:12px;height:7px;border:3px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-2px)}
.chk input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

.wrow{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:8px}
.wrow label{color:var(--hint);font-size:13px}
.step{display:flex;align-items:center;background:var(--soft);border-radius:12px}
.step button{border:0;background:transparent;width:40px;height:44px;font-size:22px;color:var(--accent)}
.step input{width:72px;border:0;background:transparent;text-align:right;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;padding:0}
.step input::placeholder{color:var(--hint);font-weight:500}
.step .kg{font-size:13px;color:var(--hint);padding:0 2px 0 3px;margin-top:6px}
.wurow{display:flex;align-items:center;justify-content:space-between;margin-top:6px;gap:8px}
.wurow label{color:var(--hint);font-size:13px}
.wubox{display:flex;align-items:center;gap:4px;background:var(--soft);border-radius:10px;padding:0 10px;height:34px}
.wubox input{width:56px;border:0;background:transparent;text-align:right;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;padding:0}
.wubox input::placeholder{color:var(--hint);font-weight:500}
.wubox span{font-size:12px;color:var(--hint)}

.last{margin-top:8px;font-size:13px;color:var(--hint);font-variant-numeric:tabular-nums}
.last b{color:var(--text);font-weight:600}

.sets{display:flex;gap:6px;margin-top:10px;align-items:center}
.sets .lb{font-size:12px;color:var(--hint);width:58px;flex:none}
.set{flex:1;min-width:0;height:40px;border-radius:10px;border:1.5px solid var(--line);background:transparent;text-align:center;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;padding:0}
.set::placeholder{color:var(--hint);opacity:.55;font-weight:500}
.set.opt{border-style:dashed}
.set.hit{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.set.miss{border-color:var(--up)}

.up{margin-top:10px;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--up) 14%,transparent);font-size:13px}
.up button{margin-left:auto;border:0;border-radius:8px;padding:6px 10px;background:var(--up);color:#fff;font-weight:600;white-space:nowrap}

details{margin-top:8px}
summary{font-size:13px;color:var(--accent);cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
.hist{margin:6px 0 0;padding:0;list-style:none;font-size:13px;font-variant-numeric:tabular-nums}
.hist li{display:flex;gap:10px;padding:4px 0;border-top:1px solid var(--line)}
.hist li span:first-child{color:var(--hint);width:44px;flex:none}
.hist li span:nth-child(2){min-width:64px;font-weight:600}

.foot{color:var(--hint);font-size:12px;text-align:center;margin-top:16px}
.loading{text-align:center;color:var(--hint);padding:40px 0}

/* ---------- Таймер ---------- */
#tbar{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:0 12px calc(12px + env(safe-area-inset-bottom, 0px))}
.tb{max-width:560px;margin:0 auto;background:var(--text);color:var(--bg);border-radius:16px;padding:10px 10px 12px 16px;display:flex;align-items:center;gap:6px;position:relative;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.tb-l{flex:1;min-width:0}
.tb-l small{display:block;font-size:12px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-l b{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.tb button{border:0;background:color-mix(in srgb,var(--bg) 18%,transparent);color:inherit;border-radius:10px;height:40px;min-width:48px;font-weight:600}
.tb i{position:absolute;left:0;bottom:0;height:3px;background:var(--ok);transition:width .25s linear}
#tbar.fin .tb{background:var(--ok);color:#fff}

/* ---------- Редактор ---------- */
.edtop{display:flex;align-items:center;gap:8px;margin:12px 0 14px}
.edtop h2{flex:1;margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.link{border:0;background:transparent;color:var(--accent);padding:6px 0;font-weight:500}
.fld{display:block;margin-bottom:14px}
.fld>span{display:block;font-size:13px;color:var(--hint);margin:0 2px 6px}
.inp{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;min-width:0}
.inp:focus{border-color:var(--accent);outline:none}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-weight:500}
.swrow input{width:20px;height:20px;accent-color:var(--ok)}
.wkt{display:flex;gap:6px;margin-bottom:12px;align-items:center}
.wkt .wk{padding:8px 14px}
.wkt .link{margin-left:auto;font-size:13px}
.wd{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.wd button{border:0;background:var(--card);border-radius:10px;padding:10px 0;font-weight:600;color:var(--hint)}
.wd button.on{background:var(--wc);color:#fff}
.edday{background:var(--card);border-radius:16px;padding:12px;margin-bottom:10px}
.eddh{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.eddh b{font-size:17px;font-weight:800;width:28px;flex:none}
.er{border-top:1px solid var(--line);padding:10px 0}
.er:first-of-type{border-top:0}
.eg{display:grid;grid-template-columns:1fr 1fr 1.3fr 1fr;gap:6px;margin-top:6px}
.eg.c{grid-template-columns:1fr 3fr;align-items:end}
.eg label{font-size:11px;color:var(--hint);display:flex;flex-direction:column;gap:3px;min-width:0}
.eg .inp{padding:8px;text-align:center}
.eg .tag{justify-self:start;margin:0 0 10px}
.ea{display:flex;align-items:center;gap:4px;margin-top:8px}
.ea .lt{display:flex;align-items:center;gap:6px;font-size:13px;margin-right:auto}
.ea .lt input{width:18px;height:18px;accent-color:var(--accent)}
.ib{border:0;background:var(--soft);border-radius:8px;min-width:34px;height:32px;padding:0 10px;font-size:14px}
.ib.del{color:var(--danger)}
.ib:disabled{opacity:.35}
.adds{display:flex;gap:6px;margin-top:4px}
.add{flex:1;border:1.5px dashed var(--line);background:transparent;border-radius:10px;padding:10px;color:var(--accent);font-weight:600}
.empty{background:var(--card);border-radius:16px;padding:20px;text-align:center;color:var(--hint);font-size:14px}
.edfoot{position:sticky;bottom:0;background:var(--bg);padding:10px 0 12px;display:flex;flex-direction:column;gap:6px;margin-top:6px}
.btn{border:0;border-radius:12px;padding:13px;font-weight:600;background:var(--soft)}
.btn.pri{background:var(--accent);color:var(--accent-text)}
.btn.danger{background:transparent;color:var(--danger)}
.row2{display:flex;gap:6px}.row2 .btn{flex:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header id="hdr">
  <div class="progs" id="progs"></div>
  <div class="weeks" id="weeks"></div>
  <div class="days" id="days"></div>
</header>
<main id="main"><div class="loading">Загружаю данные…</div></main>
<div id="tbar" hidden>
  <div class="tb">
    <div class="tb-l"><small id="tbName"></small><b id="tbTime">0:00</b></div>
    <button data-t="-15" aria-label="Минус 15 секунд">−15</button>
    <button data-t="15" aria-label="Плюс 15 секунд">+15</button>
    <button data-t="stop" aria-label="Остановить таймер">✕</button>
    <i id="tbProg"></i>
  </div>
</div>
<datalist id="exnames"></datalist>

<script>
/* ---------- Основная тренировка ---------- */
// силовое: n — название, s — подходы [мин,макс], r — повторы [мин,макс], t — отдых, st — шаг веса, l — добивка
// кардио:  n — название, k:"c", m — минуты
const X = (n, s, r, t, st = 2.5, l) => ({ n, s: [].concat(s, s).slice(0, 2), r: [].concat(r, r).slice(0, 2), t, st, ...(l ? { l: 1 } : {}) });
const C = (n, m) => ({ n, k: "c", m });
const clone = o => JSON.parse(JSON.stringify(o));
const MAIN_WEEK = {
  1: { title: "Push тяжело + Pull легко", ex: [
    X("Жим гантелей на наклонной скамье", 4, 8, "90–120 сек", 1),
    X("Жим горизонтальный в тренажере", 4, 8, "90 сек"),
    X("Разводка", 3, 12, "60 сек", 1),
    X("Французский жим гантели", 4, 10, "60–90 сек", 1),
    X("Тяга канатов в кроссовере на трицепс", 3, 10, "60 сек"),
    X("Тяга горизонтального блока", [2, 3], [12, 15], "60 сек", 1, 1),
    X("Махи гантелями в стороны", [2, 3], 15, "60 сек", 1, 1),
    C("Кардио", 15),
  ]},
  2: { title: "Ноги (квадрицепс) + Бицепс", ex: [
    X("Приседания в тренажере", 4, 10, "90–120 сек"),
    X("Жим платформы", 4, 10, "90 сек"),
    X("Разгибания ног", 4, 10, "60 сек"),
    X("Молотки на бицепс", 4, 10, "60 сек", 1),
    X("Сгибания в тренажере", [2, 3], 15, "60 сек", 1, 1),
    C("Кардио", 15),
  ]},
  4: { title: "Pull тяжело + Push легко", ex: [
    X("Тяга в смите к поясу", 4, 10, "90–120 сек"),
    X("Тяга вертикального блока", 4, 10, "90 сек"),
    X("Тяга в тренажере одной рукой", 3, 10, "60–90 сек"),
    X("Жим в смите на плечи сидя", 4, 10, "90 сек"),
    X("Отведение одной рукой в кроссовере", 3, 12, "60 сек"),
    X("Бабочка", [2, 3], [12, 15], "60 сек", 1, 1),
    X("Подъём в кроссовере на бицепс", [2, 3], [12, 15], "60 сек", 1, 1),
    C("Кардио", 15),
  ]},
  5: { title: "Ноги (задняя цепь)", ex: [
    X("Приседания широкие", 4, 10, "90–120 сек"),
    X("Мёртвая тяга", 4, 10, "90–120 сек"),
    X("Жим платформы широко", 4, 10, "90 сек"),
    X("Сгибания в тренажере на заднюю часть бедра", 4, 10, "60 сек"),
    X("Разгибания на трицепс в блоке", [2, 3], [12, 15], "60 сек", 1, 1),
    C("Кардио", 15),
  ]},
};
// перенос истории из самой первой версии приложения
const LEGACY = {
  fly_db: "Разводка", incline_db: "Жим гантелей на наклонной скамье", machine_press: "Жим горизонтальный в тренажере",
  pec_deck: "Бабочка", french_db: "Французский жим гантели", rope_pushdown: "Тяга канатов в кроссовере на трицепс",
  hack_squat: "Приседания в тренажере", leg_press: "Жим платформы", leg_ext: "Разгибания ног", hammer: "Молотки на бицепс",
  cable_curl: "Подъём в кроссовере на бицепс", smith_ohp: "Жим в смите на плечи сидя", smith_row: "Тяга в смите к поясу",
  seated_row: "Тяга горизонтального блока", lat_pulldown: "Тяга вертикального блока", row_1arm: "Тяга в тренажере одной рукой",
  lat_raise: "Махи гантелями в стороны", rear_delt: "Отведение одной рукой в кроссовере", wide_squat: "Приседания широкие",
  deadlift: "Мёртвая тяга", leg_press_wide: "Жим платформы широко", leg_curl: "Сгибания в тренажере на заднюю часть бедра",
  seated_row_l: "Тяга горизонтального блока|l", lat_raise_l: "Махи гантелями в стороны|l", leg_curl_l: "Сгибания в тренажере|l",
  pec_deck_l: "Бабочка|l", cable_curl_l: "Подъём в кроссовере на бицепс|l", tri_ext_l: "Разгибания на трицепс в блоке|l",
};

const WD = { 1: "Пн", 2: "Вт", 3: "Ср", 4: "Чт", 5: "Пт", 6: "Сб", 0: "Вс" };
const WEEK = [1, 2, 3, 4, 5, 6, 0];
const sortDays = a => [...a].sort((x, y) => (x + 6) % 7 - (y + 6) % 7);

/* ---------- Telegram + хранилище ---------- */
const tg = window.Telegram && window.Telegram.WebApp;
const inTg = !!(tg && tg.initData);
if (inTg) { tg.ready(); tg.expand(); document.documentElement.classList.add("tg"); }
const cloud = inTg && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9") ? tg.CloudStorage : null;
const haptic = t => { try { t === "ok" ? tg.HapticFeedback.notificationOccurred("success") : tg.HapticFeedback.impactOccurred("light"); } catch (e) {} };
const warn = m => inTg && tg.showAlert ? tg.showAlert(m) : alert(m);
const ask = (m, cb) => inTg && tg.showConfirm ? tg.showConfirm(m, cb) : cb(confirm(m));

const store = {
  async all() {
    if (cloud) {
      const keys = await new Promise(r => cloud.getKeys((e, k) => r(e ? [] : (k || []))));
      if (!keys.length) return {};
      return new Promise(r => cloud.getItems(keys, (e, v) => r(e ? {} : (v || {}))));
    }
    const o = {};
    try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith("wt_")) o[k.slice(3)] = localStorage.getItem(k); } } catch (e) {}
    return o;
  },
  set(k, v) {
    if (cloud) { cloud.setItem(k, v, () => {}); return; }
    try { localStorage.setItem("wt_" + k, v); } catch (e) {}
  },
  remove(keys) {
    if (!keys.length) return;
    if (cloud) { cloud.removeItems(keys, () => {}); return; }
    try { keys.forEach(k => localStorage.removeItem("wt_" + k)); } catch (e) {}
  },
};
const timers = {};
function save(key, obj, now) {
  clearTimeout(timers[key]);
  const run = () => store.set(key, JSON.stringify(obj));
  now ? run() : (timers[key] = setTimeout(run, 500));
}

/* ---------- Даты и недели ---------- */
const pad = n => String(n).padStart(2, "0");
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return x; };
const d0 = new Date();
const TODAY = dstr(d0);
const TODAY_DOW = d0.getDay();
const THIS_MONDAY = dstr(mondayOf(d0));
// какая неделя программы идёт сейчас (0 или 1): чередуются от «якорного» понедельника
function nowWeek(p) {
  if (p.weeks.length < 2) return 0;
  const diff = Math.round((mondayOf(d0) - parseD(p.anchor)) / (7 * 864e5));
  return ((diff % 2) + 2) % 2;
}

/* ---------- Состояние ---------- */
const S = { settings: { prog: "main", timer: true }, ex: {} };
const P = {};             // тренировки: {id, name, c, anchor, weeks:[{days, d}]}
let curDay = null, curWeek = null;
let draft = null;         // черновик в редакторе

function hashKey(s) {
  s = s.trim().toLowerCase().replace(/ё/g, "е").replace(/\s+/g, " ");
  let h = 0x811c9dc5;
  for (const ch of s) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); }
  return "h_" + (h >>> 0).toString(36);
}
const toRT = e => e.k === "c"
  ? { key: hashKey(e.n + "|c"), name: e.n, cardio: true, min: e.m || 15 }
  : { key: hashKey(e.n + (e.l ? "|l" : "")), name: e.n, sets: e.s, reps: e.r, rest: e.t, step: e.st || 2.5, light: !!e.l };

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const st = k => (S.ex[k] ||= { w: null, h: [], dr: null });
const fmtR = ([a, b]) => a === b ? a : `${a}–${b}`;
const fmtD = d => d.slice(8, 10) + "." + d.slice(5, 7);
const fmtW = w => w == null ? "—" : String(+(+w).toFixed(2)).replace(".", ",");
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? null : n; };
const todayEntry = s => s.h.find(e => e.d === TODAY);
const prevEntry = s => [...s.h].reverse().find(e => e.d !== TODAY);
function parseRest(t) {
  const n = parseInt((String(t).match(/\d+/) || [])[0], 10);
  if (!n) return 90;
  return /мин/.test(t) && !/сек/.test(t) ? n * 60 : n;
}

const prog = () => P[S.settings.prog] || Object.values(P)[0];
const progList = () => Object.values(P).sort((a, b) => a.c - b.c);
const week = () => prog().weeks[curWeek];
const exList = (n = curDay) => week().d[n].ex.map(toRT);
const doneCount = n => exList(n).filter(e => todayEntry(st(e.key))).length;

function pickWeekDay() {
  const p = prog();
  if (curWeek == null || curWeek >= p.weeks.length) curWeek = nowWeek(p);
  const days = week().days;
  if (days.includes(curDay)) return;
  const ord = d => (d + 6) % 7, t = ord(TODAY_DOW);
  curDay = days.find(d => d === TODAY_DOW) ?? days.find(d => ord(d) > t) ?? days[0];
}

function suggestion(ex, s) {
  if (ex.cardio || ex.light || s.w == null) return null;
  const [minS] = ex.sets, [, maxR] = ex.reps;
  const last2 = s.h.slice(-2);
  if (last2.length < 2) return null;
  if (!last2.every(e => e.w === s.w && e.r.length >= minS && e.r.every(x => x >= maxR))) return null;
  return Math.max(s.w + ex.step, Math.round(s.w * 1.05 / ex.step) * ex.step);
}

/* ---------- Таймер отдыха ---------- */
let T = null, tInt = null, actx = null;
function audio() { try { actx ||= new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) {} }
function beep() {
  try {
    const t = actx.currentTime;
    [0, 0.25, 0.5].forEach(o => {
      const os = actx.createOscillator(), g = actx.createGain();
      os.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, t + o);
      g.gain.exponentialRampToValueAtTime(0.3, t + o + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + o + 0.18);
      os.connect(g).connect(actx.destination); os.start(t + o); os.stop(t + o + 0.2);
    });
  } catch (e) {}
}
function startTimer(sec, label) {
  audio();
  T = { end: Date.now() + sec * 1000, total: sec, label, fin: false };
  clearInterval(tInt); tInt = setInterval(tick, 250); tick();
}
function stopTimer() {
  T = null; clearInterval(tInt);
  $("tbar").hidden = true; $("tbar").classList.remove("fin"); document.body.classList.remove("timing");
}
function tick() {
  if (!T) return;
  const bar = $("tbar"), left = Math.ceil((T.end - Date.now()) / 1000);
  bar.hidden = false; document.body.classList.add("timing");
  if (left <= 0) {
    if (!T.fin) {
      T.fin = true;
      bar.classList.add("fin");
      $("tbName").textContent = "Отдых окончен — следующий подход";
      $("tbTime").textContent = "0:00";
      $("tbProg").style.width = "100%";
      try { tg.HapticFeedback.notificationOccurred("warning"); } catch (e) {}
      try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (e) {}
      beep();
      const me = T; setTimeout(() => { if (T === me) stopTimer(); }, 8000);
    }
    return;
  }
  bar.classList.remove("fin");
  $("tbName").textContent = "Отдых · " + T.label;
  $("tbTime").textContent = `${Math.floor(left / 60)}:${pad(left % 60)}`;
  $("tbProg").style.width = `${Math.min(100, (1 - left / T.total) * 100)}%`;
}

/* ---------- Экран тренировки ---------- */
const $ = id => document.getElementById(id);

    `<button class="pill ico" data-edit aria-label="Изменить тренировку">✎</button>` +
    `<button class="pill ico" data-new aria-label="Новая тренировка">＋</button>`;
  $("weeks").innerHTML = (two ? [0, 1].map(i =>
      `<button class="wk${i === curWeek ? " on" : ""}${i === nw ? " now" : ""}" data-week="${i}">Неделя ${i + 1}${i === nw ? "<small>сейчас</small>" : ""}</button>`).join("") +
      `<button class="wk ico" data-swap title="Поменять текущую неделю" aria-label="Поменять текущую неделю">⇄</button>` : "") +
    `<button class="tgl${S.settings.timer ? " on" : ""}" data-timer aria-pressed="${S.settings.timer}"><span class="sw"></span>Таймер</button>`;

    const cls = ["day", n === curDay && "on", isNow && n === TODAY_DOW && "today", dn === tot && "full"].filter(Boolean).join(" ");
    return `<button class="${cls}" data-day="${n}"><b>${WD[n]}</b><small>${dn}/${tot}</small></button>`;
  }).join("");
}

function historyHTML(s, ex) {
  if (!s.h.length) return "";
  const li = [...s.h].reverse().slice(0, 8).map(e => ex.cardio
    ? `<li><span>${fmtD(e.d)}</span><span>${e.m} мин</span></li>`
    : `<li><span>${fmtD(e.d)}</span><span>${fmtW(e.w)} кг</span><span>${e.r.join(" / ")}${e.wu != null ? ` · разм. ${fmtW(e.wu)}` : ""}</span></li>`).join("");
  return `<details><summary>История (${s.h.length})</summary><ul class="hist">${li}</ul></details>`;
}
const checkHTML = done => `<label class="chk" title="Выполнил"><input type="checkbox" ${done ? "checked" : ""} aria-label="Выполнил"><span></span></label>`;

function cardioHTML(ex) {
  const s = st(ex.key), te = todayEntry(s), pe = prevEntry(s);
  const m = te ? te.m : (s.m ?? ex.min);
  return `
  <article class="ex cardio${te ? " done" : ""}" data-id="${ex.key}">
    <div class="top">
      <div class="nm"><h3>${esc(ex.name)}<span class="tag c">кардио</span></h3><p>Цель: ${ex.min} мин</p></div>
      ${checkHTML(te)}
    </div>
    <div class="wrow">
      <label>Минуты</label>
      <div class="step">
        <button data-act="-" aria-label="Меньше минут">−</button>
        <input class="mn" inputmode="numeric" value="${m}" aria-label="Минуты кардио">
        <span class="kg">мин</span>
        <button data-act="+" aria-label="Больше минут">+</button>
      </div>
    </div>
    <div class="last">${pe ? `Прошлый раз ${fmtD(pe.d)}: <b>${pe.m} мин</b>` : "Прошлых записей нет"}</div>
    ${historyHTML(s, ex)}
  </article>`;
}

function cardHTML(ex) {
  if (ex.cardio) return cardioHTML(ex);
  const s = st(ex.key), te = todayEntry(s), pe = prevEntry(s);
  const [minS, maxS] = ex.sets, [minR, maxR] = ex.reps;
  const reps = te ? te.r : (s.dr && s.dr.d === TODAY ? s.dr.r : []);
  const sets = Array.from({ length: maxS }, (_, i) => {
    const v = reps[i] ?? "";
    const cls = ["set", i >= minS && "opt", v !== "" && (v >= maxR ? "hit" : v < minR ? "miss" : "")].filter(Boolean).join(" ");
    return `<input class="${cls}" data-i="${i}" type="number" inputmode="numeric" min="0" placeholder="${maxR}" value="${v}" aria-label="Подход ${i + 1}, повторения">`;
  }).join("");
  const sug = suggestion(ex, s);
  const rest = S.settings.timer ? `<button class="rb" data-rest title="Запустить таймер">⏱ ${esc(ex.rest)}</button>` : `отдых ${esc(ex.rest)}`;
  return `
  <article class="ex${te ? " done" : ""}${ex.light ? " light" : ""}" data-id="${ex.key}">
    <div class="top">
      <div class="nm">
        <h3>${esc(ex.name)}${ex.light ? '<span class="tag">добивка</span>' : ""}</h3>
        <p>${fmtR(ex.sets)} × ${fmtR(ex.reps)}, ${rest}</p>
      </div>
      ${checkHTML(te)}
    </div>
    <div class="wrow">
      <label>Рабочий вес</label>
      <div class="step">
        <button data-act="-" aria-label="Уменьшить вес">−</button>
        <input class="w" inputmode="decimal" placeholder="—" value="${s.w == null ? "" : fmtW(s.w)}" aria-label="Рабочий вес, кг">
        <span class="kg">кг</span>
        <button data-act="+" aria-label="Увеличить вес">+</button>
      </div>
    </div>
    ${ex.light ? "" : `
    <div class="wurow">
      <label>Разминочный вес</label>
      <div class="wubox"><input class="wu" inputmode="decimal" placeholder="—" value="${s.wu == null ? "" : fmtW(s.wu)}" aria-label="Разминочный вес, кг"><span>кг</span></div>
    </div>`}
    <div class="last">${pe ? `Прошлый раз ${fmtD(pe.d)}: <b>${fmtW(pe.w)} кг</b>, ${pe.r.join(" / ")}${pe.wu != null ? ` · разминка ${fmtW(pe.wu)} кг` : ""}` : "Прошлых записей нет — введи вес и отметь подходы"}</div>
    <div class="sets"><span class="lb">Повторы</span>${sets}</div>
    ${sug ? `<div class="up">Два раза подряд закрыл ${maxR} повторов<button data-up="${sug}">Поставить ${fmtW(sug)} кг</button></div>` : ""}
    ${historyHTML(s, ex)}
  </article>`;
}

function dayInfo() {
  const tot = exList().length, dn = doneCount(curDay);
  const wk = prog().weeks.length === 2 ? `<em>Неделя ${curWeek + 1}</em> · ` : "";
  return { tot, dn, html: `${wk}${dn} из ${tot}` };
}

function renderMain() {
  const day = week().d[curDay], list = exList(), i = dayInfo();
  $("main").innerHTML = `
    <div class="dayhead"><h1>${esc(day.title)}</h1><span>${i.html}</span></div>
    <div class="bar"><i style="width:${i.tot ? i.dn / i.tot * 100 : 0}%"></i></div>
    ${list.map(cardHTML).join("")}
    <p class="foot">${cloud ? "Данные сохраняются в облаке Telegram" : "Данные сохраняются в этом браузере"}</p>`;
}

function showWorkout() { pickWeekDay(); $("hdr").hidden = false; renderHeader(); renderMain(); }

function rerenderCard(card) {
  const ex = exList().find(e => e.key === card.dataset.id);
  const open = card.querySelector("details")?.open;
  card.outerHTML = cardHTML(ex);
  if (open) document.querySelector(`[data-id="${ex.key}"] details`).open = true;
  const i = dayInfo();
  document.querySelector(".dayhead span").innerHTML = i.html;
  document.querySelector(".bar i").style.width = `${i.dn / i.tot * 100}%`;
  renderHeader();
}

const readSets = card => [...card.querySelectorAll(".set")].map(i => i.value === "" ? null : Math.max(0, parseInt(i.value, 10)));
const exOf = card => exList().find(e => e.key === card.dataset.id);
const persist = (k, now) => save(k, S.ex[k], now);

function complete(card, ex, s) {
  let entry;
  if (ex.cardio) {
    entry = { d: TODAY, m: s.m ?? ex.min };
  } else {
    const [minS, maxS] = ex.sets, [minR, maxR] = ex.reps;
    const fill = minR === maxR ? maxR : minR;   // пустые обязательные подходы = по плану
    const vals = readSets(card), r = [];
    for (let i = 0; i < maxS; i++) {
      if (vals[i] != null) r.push(vals[i]);
      else if (i < minS) r.push(fill);
    }
    entry = { d: TODAY, w: s.w, r };
    if (s.wu != null) entry.wu = s.wu;
  }
  s.h = s.h.filter(x => x.d !== TODAY);
  s.h.push(entry);
  s.h = s.h.slice(-12);
  s.dr = null;
  haptic("ok");
  persist(ex.key, true);
  rerenderCard(card);
}
function uncomplete(card, ex, s) {
  const te = todayEntry(s);
  if (te && !ex.cardio) s.dr = { d: TODAY, r: te.r };
  s.h = s.h.filter(x => x.d !== TODAY);
  haptic();
  persist(ex.key, true);
  rerenderCard(card);
}

/* ---------- Редактор тренировки ---------- */
const rangeStr = ([a, b]) => a === b ? String(a) : `${a}-${b}`;
function parseRange(v, def) {
  const m = String(v).match(/(\d+)\s*[-–—]\s*(\d+)/);
  if (m) { const a = +m[1], b = +m[2]; return a && b ? [Math.min(a, b), Math.max(a, b)] : def; }
  const n = parseInt(v, 10);
  return n > 0 ? [n, n] : def;
}
const blankEx = () => ({ n: "", s: "4", r: "10", t: "60 сек", st: 2.5, l: false });
const blankCardio = () => ({ k: "c", n: "Кардио", m: "15" });
const toDraftEx = e => e.k === "c" ? { k: "c", n: e.n, m: String(e.m) } : { n: e.n, s: rangeStr(e.s), r: rangeStr(e.r), t: e.t, st: e.st || 2.5, l: !!e.l };
const toDraftWeek = w => ({ days: [...w.days], d: Object.fromEntries(Object.entries(w.d).map(([k, v]) => [k, { title: v.title, ex: v.ex.map(toDraftEx) }])) });

function openEditor(p) {
  draft = p
    ? { id: p.id, isNew: false, name: p.name, anchor: p.anchor, two: p.weeks.length === 2,
        weeks: [toDraftWeek(p.weeks[0]), p.weeks[1] ? toDraftWeek(p.weeks[1]) : { days: [], d: {} }],
        ew: Math.min(curWeek ?? 0, p.weeks.length - 1) }
    : { id: "u" + Date.now().toString(36), isNew: true, name: "", anchor: THIS_MONDAY, two: false,
        weeks: [{ days: [], d: {} }, { days: [], d: {} }], ew: 0 };
  $("hdr").hidden = true;
  if (inTg && tg.BackButton) { tg.BackButton.onClick(closeEditor); tg.BackButton.show(); }
  renderEditor();
  window.scrollTo(0, 0);
}
function closeEditor() {
  draft = null;
  if (inTg && tg.BackButton) { tg.BackButton.offClick(closeEditor); tg.BackButton.hide(); }
  showWorkout();
  window.scrollTo(0, 0);
}

function collect() {
  const root = $("main"), w = draft.weeks[draft.ew];
  draft.name = root.querySelector("#edName").value;
  root.querySelectorAll(".edday").forEach(dd => {
    const day = w.d[dd.dataset.dow];
    day.title = dd.querySelector(".dt").value;
    day.ex = [...dd.querySelectorAll(".er")].map(r => r.dataset.k === "c"
      ? { k: "c", n: r.querySelector(".en").value, m: r.querySelector(".em").value }
      : { n: r.querySelector(".en").value, s: r.querySelector(".es").value, r: r.querySelector(".erp").value,
          t: r.querySelector(".et").value, st: +r.querySelector(".est").value, l: r.querySelector(".elt").checked });
  });
}

function buildWeek(w, label) {
  const days = sortDays(w.days);
  if (!days.length) return `${label}: выбери хотя бы один день`;
  const d = {};
  for (const n of days) {
    const ex = w.d[n].ex.filter(e => e.n.trim()).map(e => e.k === "c"
      ? { n: e.n.trim(), k: "c", m: Math.max(1, parseInt(e.m, 10) || 15) }
      : { n: e.n.trim(), s: parseRange(e.s, [4, 4]), r: parseRange(e.r, [10, 10]), t: e.t.trim() || "60 сек", st: e.st || 2.5, ...(e.l ? { l: 1 } : {}) });
    if (!ex.length) return `${label}, ${WD[n]}: нет ни одного упражнения`;
    d[n] = { title: w.d[n].title.trim() || "Тренировка", ex };
    if (JSON.stringify(d[n]).length > 3900) return `${label}, ${WD[n]}: слишком много упражнений — раздели на два дня`;
  }
  return { days, d };
}

const dayKeys = p => p.weeks.flatMap((w, i) => w.days.map(n => `pd_${p.id}_${i + 1}_${n}`));

function saveDraft() {
  collect();
  const name = draft.name.trim();
  if (!name) return warn("Введи название тренировки");
  const weeks = [];
  for (let i = 0; i < (draft.two ? 2 : 1); i++) {
    const r = buildWeek(draft.weeks[i], draft.two ? `Неделя ${i + 1}` : "Тренировка");
    if (typeof r === "string") { if (draft.ew !== i) { draft.ew = i; renderEditor(); } return warn(r); }
    weeks.push(r);
  }
  const old = P[draft.id];
  const p = { id: draft.id, name, c: old ? old.c : Date.now(), anchor: (old && old.anchor) || draft.anchor || THIS_MONDAY, weeks };
  if (old) { const keep = new Set(dayKeys(p)); store.remove(dayKeys(old).filter(k => !keep.has(k))); }
  P[p.id] = p;
  saveProg(p);
  S.settings.prog = p.id; save("settings", S.settings, true);
  curWeek = null;
  refreshNames();
  haptic("ok");
  closeEditor();
}

const saveMeta = p => store.set(`p_${p.id}`, JSON.stringify({ name: p.name, c: p.c, anchor: p.anchor, weeks: p.weeks.map(w => ({ days: w.days })) }));
function saveProg(p) {
  saveMeta(p);
  p.weeks.forEach((w, i) => w.days.forEach(n => store.set(`pd_${p.id}_${i + 1}_${n}`, JSON.stringify(w.d[n]))));
}

function onEditorClick(btn) {
  const act = btn.dataset.ed;
  if (act === "cancel") return closeEditor();
  if (act === "save") return saveDraft();
  collect();
  const w = draft.weeks[draft.ew];
  if (act === "wk") { draft.ew = +btn.dataset.week; haptic(); }
  else if (act === "copyw") {
    const doCopy = () => { draft.weeks[1] = clone(draft.weeks[0]); renderEditor(); haptic("ok"); };
    if (draft.weeks[1].days.length) return ask("Заменить неделю 2 копией недели 1?", ok => ok && doCopy());
    doCopy(); return;
  }
  else if (act === "day") {
    const n = +btn.dataset.dow;
    if (w.days.includes(n)) w.days = w.days.filter(x => x !== n);
    else { w.days.push(n); w.d[n] ||= { title: "", ex: [blankEx()] }; }
    haptic();
  } else if (act === "copy") {
    draft = { ...draft, id: "u" + Date.now().toString(36), isNew: true, name: draft.name.trim() + " (копия)" };
  } else if (act === "remove") {
    const id = draft.id;
    return ask(`Удалить «${P[id].name}»? История весов упражнений сохранится.`, ok => {
      if (!ok) return;
      store.remove([`p_${id}`, ...dayKeys(P[id])]);
      delete P[id];
      S.settings.prog = progList()[0].id; save("settings", S.settings, true);
      curWeek = null;
      refreshNames(); closeEditor();
    });
  } else {
    const dd = btn.closest(".edday"), list = w.d[dd.dataset.dow].ex;
    if (act === "add" || act === "addc") {
      list.push(act === "add" ? blankEx() : blankCardio());
      renderEditor();
      const rows = $("main").querySelectorAll(`.edday[data-dow="${dd.dataset.dow}"] .en`);
      const last = rows[rows.length - 1]; last.focus(); if (act === "addc") last.select();
      return;
    }
    const i = +btn.closest(".er").dataset.i;
    if (act === "del") list.splice(i, 1);
    if (act === "up" && i > 0) [list[i - 1], list[i]] = [list[i], list[i - 1]];
    if (act === "down" && i < list.length - 1) [list[i + 1], list[i]] = [list[i], list[i + 1]];
  }
  renderEditor();
}

/* ---------- События ---------- */
document.addEventListener("click", e => {
  const tb = e.target.closest("[data-t]");
  if (tb) {
    if (!T) return;
    const v = tb.dataset.t;
    if (v === "stop") return stopTimer();
    if (T.fin) { T = { end: Date.now() + 15000, total: 15, label: T.label, fin: false }; clearInterval(tInt); tInt = setInterval(tick, 250); }
    else { T.end += +v * 1000; T.total = Math.max(1, T.total + +v); }
    tick(); haptic(); return;
  }
  if (draft) { const b = e.target.closest("[data-ed]"); if (b) onEditorClick(b); return; }

  const p = e.target.closest("[data-prog]");
  if (p) { S.settings.prog = p.dataset.prog; curWeek = null; save("settings", S.settings, true); showWorkout(); haptic(); return; }
  if (e.target.closest("[data-edit]")) return openEditor(prog());
  if (e.target.closest("[data-new]")) return openEditor(null);
  if (e.target.closest("[data-timer]")) {
    S.settings.timer = !S.settings.timer; save("settings", S.settings, true);
    if (!S.settings.timer) stopTimer();
    renderHeader(); renderMain(); haptic(); return;
  }
  if (e.target.closest("[data-swap]")) {
    const pr = prog();
    const a = parseD(pr.anchor || THIS_MONDAY); a.setDate(a.getDate() + 7); pr.anchor = dstr(a);
    saveMeta(pr); curWeek = nowWeek(pr); pickWeekDay(); renderHeader(); renderMain(); haptic("ok"); return;
  }
  const wk = e.target.closest("[data-week]");
  if (wk) { curWeek = +wk.dataset.week; pickWeekDay(); renderHeader(); renderMain(); haptic(); return; }
  const d = e.target.closest("[data-day]");
  if (d) { curDay = +d.dataset.day; renderHeader(); renderMain(); window.scrollTo(0, 0); haptic(); return; }

  const card = e.target.closest(".ex"); if (!card) return;
  const ex = exOf(card), s = st(ex.key);
  if (e.target.closest("[data-rest]")) { startTimer(parseRest(ex.rest), ex.name); haptic(); return; }
  const act = e.target.closest("[data-act]");
  if (act) {
    const sign = act.dataset.act === "+" ? 1 : -1;
    const te = todayEntry(s);
    if (ex.cardio) {
      s.m = Math.max(0, (s.m ?? te?.m ?? ex.min) + sign * 5);
      if (te) te.m = s.m;
    } else {
      const base = s.w ?? prevEntry(s)?.w ?? 0;
      s.w = Math.max(0, +(base + sign * ex.step).toFixed(2));
      if (te) te.w = s.w;
    }
    persist(ex.key); rerenderCard(card); haptic(); return;
  }
  const up = e.target.closest("[data-up]");
  if (up) { s.w = +up.dataset.up; persist(ex.key, true); rerenderCard(card); haptic("ok"); }
});

let blurTimer = null;
document.addEventListener("input", e => {
  if (draft) return;
  const card = e.target.closest(".ex"); if (!card) return;
  const ex = exOf(card), s = st(ex.key), te = todayEntry(s), cl = e.target.classList;
  if (cl.contains("set")) {
    const r = readSets(card);
    if (te) te.r = r.filter(v => v != null);
    else s.dr = { d: TODAY, r: r.map(v => v ?? "") };
    const [minR, maxR] = ex.reps, v = r[+e.target.dataset.i];
    cl.toggle("hit", v != null && v >= maxR);
    cl.toggle("miss", v != null && v < minR);
    persist(ex.key);
    // через полторы секунды после ввода подход считается введённым (скрывает клавиатуру → change)
    clearTimeout(blurTimer);
    const tgt = e.target;
    if (tgt.value !== "") blurTimer = setTimeout(() => { if (document.activeElement === tgt) tgt.blur(); }, 1500);
  } else if (cl.contains("w")) {
    s.w = num(e.target.value);
    if (te && s.w != null) te.w = s.w;
    persist(ex.key);
  } else if (cl.contains("wu")) {
    s.wu = num(e.target.value);
    if (te) { if (s.wu != null) te.wu = s.wu; else delete te.wu; }
    persist(ex.key);
  } else if (cl.contains("mn")) {
    const v = parseInt(e.target.value, 10);
    s.m = isNaN(v) ? null : v;
    if (te && s.m != null) te.m = s.m;
    persist(ex.key);
  }
});

document.addEventListener("change", e => {
  if (draft) {
    if (e.target.id === "edTwo") {
      collect();
      draft.two = e.target.checked;
      if (draft.two && !draft.weeks[1].days.length) draft.weeks[1] = clone(draft.weeks[0]);
      if (!draft.two) draft.ew = 0;
      renderEditor(); haptic();
    }
    return;
  }
  const card = e.target.closest(".ex"); if (!card) return;
  const ex = exOf(card), s = st(ex.key), cl = e.target.classList;
  if (cl.contains("w") || cl.contains("mn")) { rerenderCard(card); return; }

  if (cl.contains("set")) {
    if (e.target.value === "") return;
    if (S.settings.timer) startTimer(parseRest(ex.rest), ex.name);
    if (todayEntry(s)) return;
    const vals = readSets(card);
    if (vals.slice(0, ex.sets[0]).every(v => v != null)) {
      if (s.w == null) { warn("Все подходы введены — укажи рабочий вес, и упражнение засчитается"); card.querySelector(".w").focus(); return; }
      complete(card, ex, s);
    }
    return;
  }

  if (e.target.type !== "checkbox") return;
  if (e.target.checked) {
    if (!ex.cardio && s.w == null) {
      e.target.checked = false;
      warn("Сначала укажи рабочий вес");
      card.querySelector(".w").focus();
      return;
    }
    complete(card, ex, s);
  } else uncomplete(card, ex, s);
});

/* ---------- Старт ---------- */
(async () => {
  const raw = await store.all();
  const J = v => { try { return JSON.parse(v); } catch (e) { return null; } };
  const legacy = [], oldKeys = [], migrated = new Set();
  for (const [k, v] of Object.entries(raw)) {
    const o = J(v); if (!o) continue;
    if (k === "settings") Object.assign(S.settings, o);
    else if (k.startsWith("h_")) S.ex[k] = o;
    else if (k.startsWith("ex_")) legacy.push([k, o]);
    else if (k.startsWith("p_")) {
      const id = k.slice(2);
      P[id] = { id, name: o.name, c: o.c, anchor: o.anchor, weeks: (o.weeks || [{ days: o.days || [] }]).map(w => ({ days: w.days || [], d: {} })) };
      if (!o.weeks) migrated.add(id);
    }
  }
  for (const [k, v] of Object.entries(raw)) {
    if (!k.startsWith("pd_")) continue;
    const o = J(v); if (!o) continue;
    let m = k.match(/^pd_(.+)_([12])_(\d)$/);
    if (m && P[m[1]] && P[m[1]].weeks[m[2] - 1]) { P[m[1]].weeks[m[2] - 1].d[m[3]] = o; continue; }
    m = k.match(/^pd_(.+)_(\d)$/);                       // формат предыдущей версии
    if (m && P[m[1]]) { P[m[1]].weeks[0].d[m[2]] = o; oldKeys.push(k); migrated.add(m[1]); }
  }
  for (const p of Object.values(P)) {
    p.weeks = p.weeks.map(w => ({ days: sortDays(w.days.filter(n => w.d[n])), d: w.d })).filter((w, i) => i === 0 || w.days.length);
    if (!p.weeks[0].days.length) { delete P[p.id]; continue; }
    if (!p.anchor) { p.anchor = THIS_MONDAY; migrated.add(p.id); }
    if (p.id === "main" && migrated.has("main") && p.weeks.length === 1) {
      // обновление основной: кардио в конце каждого дня + вторая неделя (копия первой)
      Object.values(p.weeks[0].d).forEach(d => { if (!d.ex.some(e => e.k === "c")) d.ex.push(C("Кардио", 15)); });
      p.weeks.push(clone(p.weeks[0]));
    }
    if (migrated.has(p.id)) saveProg(p);
  }
  store.remove(oldKeys);

  if (!Object.keys(P).length) {
    const main = { id: "main", name: "Основная тренировка", c: 1, anchor: THIS_MONDAY,
      weeks: [{ days: [1, 2, 4, 5], d: clone(MAIN_WEEK) }, { days: [1, 2, 4, 5], d: clone(MAIN_WEEK) }] };
    P.main = main; saveProg(main);
  }

  for (const [k, o] of legacy) {
    const name = LEGACY[k.slice(3)]; if (!name) continue;
    const key = hashKey(name);
    if (!S.ex[key]) { S.ex[key] = o; save(key, o, true); }
  }
  if (legacy.length) store.remove(legacy.map(([k]) => k));

  if (!P[S.settings.prog]) S.settings.prog = progList()[0].id;
  refreshNames();
  showWorkout();
})();
</script>
