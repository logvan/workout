<!doctype html>
<html lang="ru" data-theme="dark" data-pal="emerald">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Дневник</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
/* ==== АДРЕС СКРИПТА: вставьте ссылку из Google Apps Script (Развернуть → веб-приложение) ==== */
const API_URL = 'https://script.google.com/macros/s/AKfycbwP7J7tde2sXOjCYW-TAZlanAxN-LCSL9iE8ou-yKtYeqk-qHPhxOyNAibrvMG9MuGt/exec';
/* ======================================================================================== */
try { const u = JSON.parse(localStorage.getItem('ui') || '{}'); if (u.pal) document.documentElement.dataset.pal = u.pal; if (u.theme) document.documentElement.dataset.mode = u.theme; } catch (e) {}
</script>
<style>
:root{
  --bg:#14171A; --card:#1E2327; --card2:#2A3035; --line:#2A3035; --text:#EDE6DA; --hint:#9A9488;
  --accent:#4FB39A; --btn:#1F6B5A; --btn-text:#EEF3EF;
  --ok:#4FB39A; --minus:#E0706B; --up:#D9A35B; --w2:#A595D2;
  --cP:#9A88C4; --cF:#C9808A; --cC:#6F8FD6; --water:#5FA7C4; --steps:#D9A35B;
  --accent-text:var(--btn-text); --danger:var(--minus); --plus:var(--ok);
  --soft:color-mix(in srgb,var(--hint) 14%,transparent);
  --tab:72px;
}
[data-pal="blue"]{--accent:#6F8FD6;--btn:#2A4478}
[data-pal="burgundy"]{--accent:#C86A7A;--btn:#6E2232;--cF:#D9A06B}
[data-pal="graphite"]{--accent:#C2A266;--btn:#4A4234}
[data-theme="light"]{--steps:#B7802F;--bg:#F3F0EA;--card:#FFFFFF;--card2:#ECE8E0;--line:#E5E0D6;--text:#1C1E20;--hint:#77736A;--ok:#2E8A72;--minus:#C2453F;--water:#3C86A6}
[data-theme="light"][data-pal="emerald"]{--accent:#2E8A72}
[data-theme="light"][data-pal="blue"]{--accent:#3F63B0}
[data-theme="light"][data-pal="burgundy"]{--accent:#A33E50}
[data-theme="light"][data-pal="graphite"]{--accent:#8C6E33}

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:"Onest",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px;line-height:1.35;-webkit-tap-highlight-color:transparent;padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom,0px))}
body.sub{padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.view{max-width:560px;margin:0 auto;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px}
#v-train{padding-bottom:0}

/* ---------- общие элементы ---------- */
.c-top{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.c-ttl{flex:1;min-width:0}
.c-ttl h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.c-eyebrow{display:flex;align-items:center;gap:4px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--hint);margin-bottom:4px}
.c-eyebrow button{border:0;background:transparent;color:var(--hint);width:30px;height:28px;font-size:18px;padding:0;margin:0 -4px}
.c-eyebrow button:disabled{opacity:.25}
.c-icon{width:44px;height:44px;flex:none;border-radius:22px;border:1px solid var(--card2);background:transparent;display:grid;place-items:center;color:var(--text)}
.c-icon svg{width:20px;height:20px}
.c-card{background:var(--card);border-radius:22px;padding:18px;margin-bottom:12px}
.c-card.c-tap{display:block;cursor:pointer;-webkit-user-select:none;user-select:none}
.c-card.c-tap:active{opacity:.85}
.c-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.c-h{font-weight:600;font-size:16px}
.c-mut{color:var(--hint);font-size:12px}
.c-acc{color:var(--accent)}
.c-big{font-weight:600;font-size:30px;letter-spacing:-.02em;line-height:1}
.c-btn{height:44px;border:0;border-radius:14px;background:var(--btn);color:var(--btn-text);font-weight:500;padding:0 16px}
.c-btn.ghost{background:var(--card2);color:var(--text)}
.c-btn.out{background:transparent;border:1px solid var(--accent);color:var(--accent)}
.c-btn.wide{width:100%}
.c-btn.danger{background:transparent;color:var(--minus);border:1px solid color-mix(in srgb,var(--minus) 50%,transparent)}
.c-btn:disabled{opacity:.5}
.c-round{width:36px;height:36px;border-radius:18px;border:0;background:var(--card2);display:grid;place-items:center;font-size:18px;flex:none;color:var(--text)}
.c-round.pri{background:var(--btn);color:var(--btn-text)}
.c-bar{height:4px;border-radius:2px;background:var(--card2);overflow:hidden}
.c-bar i{display:block;height:100%;border-radius:2px}
.c-inp{width:100%;min-width:0;height:44px;border-radius:12px;border:1.5px solid var(--card2);background:var(--bg);padding:0 12px;font-size:16px}
.c-inp:focus{outline:none;border-color:var(--accent)}
.c-seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--card);margin-bottom:14px}
.c-seg button{flex:1;height:38px;border:0;border-radius:10px;background:transparent;color:var(--hint);font-size:13px}
.c-seg button.on{background:var(--card2);color:var(--text)}
.c-note{font-size:13px;color:var(--hint);background:var(--card);border-radius:14px;padding:10px 14px;margin-bottom:12px}
.pos{color:var(--ok)!important}.neg{color:var(--minus)!important}
.c-skel{color:var(--hint);font-size:14px}
.c-empty{color:var(--hint);text-align:center;padding:18px 8px;font-size:14px}

/* таббар */
#tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--bg);border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around}
#tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:64px;padding:6px 0;font-size:10px;color:var(--hint)}
#tabbar button.on{color:var(--accent)}
#tabbar svg{width:22px;height:22px}
body.sub #tabbar{display:none}

/* главная */
.h-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center;font-size:11px;color:var(--hint);margin:14px 0}
.h-week div{display:flex;flex-direction:column;align-items:center;gap:6px}
.h-dot{width:30px;height:30px;border-radius:15px;display:grid;place-items:center;font-size:13px;background:var(--card2)}
.h-dot.done{background:var(--btn);color:var(--btn-text)}
.h-dot.plan{background:transparent;border:1px solid var(--accent)}
.h-dot.today{background:transparent;border:1px dashed var(--hint)}
.h-dot.today.plan{border-style:solid;border-width:2px}
.h-next{border-top:1px solid var(--card2);padding-top:14px}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring b{font-weight:600;font-size:21px;letter-spacing:-.02em}
.mrow{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--hint)}
.mrow .c-bar{flex:1}
.mrow span:first-child{width:16px}.mrow span:last-child{width:56px;text-align:right}
.water{display:grid;gap:4px;margin-top:10px}
.water i{height:8px;border-radius:4px;background:var(--card2)}
.water i.on{background:var(--water)}

/* питание */
.f-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 22px}
.f-stat{display:flex;flex-direction:column;gap:7px}
.f-stat b{font-weight:600;font-size:20px}
.f-stat small{font-weight:400;font-size:12px;color:var(--hint)}
.meal{background:var(--card);border-radius:18px;padding:12px 14px 12px 16px;margin-bottom:8px}
.meal.empty{background:transparent;border:1px dashed var(--card2)}
.meal-h{display:flex;align-items:center;gap:10px}
.meal-h .c-h{flex:1}
.ent{display:flex;justify-content:space-between;gap:12px;width:100%;border:0;background:transparent;padding:6px 0;font-size:14px;text-align:left;color:inherit}
.ent span:last-child{color:var(--hint);flex:none}
.ent-edit{display:flex;gap:6px;align-items:center;padding:6px 0 4px}
.ent-edit .c-inp{width:96px;flex:none;text-align:center}
.ent-edit .c-btn{height:40px;padding:0 12px;font-size:13px}

/* добавить */
.a-search{display:flex;gap:8px;margin-bottom:10px}
.a-item{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;border:0;border-bottom:1px solid var(--card2);background:transparent;padding:12px 4px;text-align:left;color:inherit}
.a-item small{display:block;color:var(--hint);font-size:12px;margin-top:2px}
.a-item span:last-child{color:var(--hint);font-size:13px;flex:none}
.a-sub{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--hint);margin:14px 4px 4px}
.a-panel{position:sticky;bottom:0;background:var(--card);border-radius:24px 24px 0 0;margin:14px -16px -16px;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;box-shadow:0 -10px 30px rgba(0,0,0,.25)}
.a-amt{display:flex;align-items:center;justify-content:space-between}
.a-amt input{width:120px;border:0;background:transparent;text-align:right;font-size:40px;font-weight:600;letter-spacing:-.02em;padding:0}
.a-amt .c-round{width:48px;height:48px;border-radius:24px;border:1px solid var(--card2);background:transparent;font-size:22px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--card2);background:transparent;font-size:13px;color:var(--text)}
.chip.on{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.chip.solid.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.macro4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));text-align:center;gap:6px}
.macro4 b{display:block;font-weight:600;font-size:20px}
.macro4 small{font-size:11px;color:var(--hint)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fgrid label,.flbl{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--hint)}

/* прогресс */
.tiles3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.tile3{background:var(--card);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile3 small{font-size:11px;color:var(--hint)}
.tile3 b{font-weight:600;font-size:21px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl{list-style:none;margin:0;padding:0}
.wl li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--card2);font-size:14px}
.wl li:first-child{border-top:0}
.wl li span{width:72px;color:var(--hint)}
.wl li b{flex:1;font-weight:600}
.wl li em{font-style:normal;font-weight:600;width:44px;text-align:right}
.wl li button{border:0;background:var(--card2);border-radius:8px;min-width:30px;height:28px;padding:0 8px;color:var(--minus)}
.bars{display:grid;gap:8px;align-items:end}
.bars div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:var(--hint)}
.bars i{display:block;width:100%;border-radius:6px;background:var(--accent)}
.bars b{font-size:10px;font-weight:500;color:var(--hint);font-variant-numeric:tabular-nums;white-space:nowrap;min-height:13px}
.bars i.over{background:var(--cF)}
.bars i.cur{background:transparent;border:1px dashed var(--accent)}
.bars i.dim{background:color-mix(in srgb,var(--accent) 35%,var(--card))}

/* настройки */
.s-h{margin:18px 4px 8px;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--hint)}
.s-box{background:var(--card);border-radius:20px;padding:4px 16px}
.s-row{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:52px;border-top:1px solid var(--card2);font-size:14px;width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;padding:0;text-align:left;color:inherit}
.s-box>.s-row:first-child{border-top:0}
.s-row span:last-child{color:var(--hint)}
.s-row input.c-inp{width:110px;height:38px;text-align:right}
.sw{width:48px;height:28px;border-radius:14px;border:0;padding:3px;display:flex;justify-content:flex-start;background:var(--card2);flex:none}
.sw::after{content:"";width:22px;height:22px;border-radius:11px;background:#EEF3EF}
.sw.on{justify-content:flex-end;background:var(--btn)}
.pals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:12px 0}
.pals button{height:72px;border-radius:14px;border:1px solid var(--card2);background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:12px;color:var(--hint)}
.pals button.on{border-color:var(--accent);color:var(--text);background:var(--card2)}
.pals i{width:22px;height:22px;border-radius:11px}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab) + 16px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--text);color:var(--bg);border-radius:14px;padding:10px 16px;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.3)}
body.sub #toast{bottom:calc(24px + env(safe-area-inset-bottom,0px))}

/* ---------- тренировка (из дневника тренировок) ---------- */
#hdr{position:sticky;top:0;z-index:5;background:var(--bg);padding:4px 0 8px}
.progs{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 8px;padding:0 16px;scrollbar-width:none}
.progs::-webkit-scrollbar{display:none}
.pill{border:0;background:var(--card);border-radius:999px;padding:7px 13px;white-space:nowrap;font-size:13px;font-weight:500;flex:none}
.pill.on{background:var(--text);color:var(--bg)}
.weeks{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.wseg{flex:1;min-width:0;display:flex;gap:3px;background:var(--card);border-radius:12px;padding:3px}
.ws{flex:1;min-width:0;border:0;background:transparent;border-radius:9px;height:34px;font-size:14px;font-weight:600;color:var(--hint);display:flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.ws[data-week="0"]{--c:var(--accent)} .ws[data-week="1"]{--c:var(--w2)}
.ws.on{background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--c)}
.ws.now::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
body{--wc:var(--btn)} body[data-wc="2"]{--wc:#4E447A}
.days{display:grid;gap:6px}
.day{border:0;background:var(--card);border-radius:12px;padding:8px 2px 7px;text-align:center;position:relative;min-width:0}
.day b{display:block;font-size:17px;font-weight:700}
.day small{display:block;font-size:11px;color:var(--hint);font-variant-numeric:tabular-nums}
.day.on{background:var(--wc);color:#fff}
.day.on small{color:#fff;opacity:.8}
.day.today::after{content:"";position:absolute;top:6px;right:8px;width:6px;height:6px;border-radius:50%;background:var(--ok)}
.day.full small{color:var(--ok);font-weight:600}
.day.on.full small{color:#fff}
#main{padding:4px 0 16px}
body.timing #main{padding-bottom:110px}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:10px 2px 8px}
.dayhead h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em}
.dayhead span{color:var(--hint);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.dayhead em{font-style:normal;color:var(--accent);font-weight:600}
.bar{height:4px;background:var(--soft);border-radius:2px;margin:0 2px 14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);transition:width .25s}
.ex{background:var(--card);border-radius:18px;margin-bottom:10px;border-left:4px solid transparent;transition:border-color .2s;padding:0;overflow:hidden}
.ex.done{border-left-color:var(--ok)}
.ex.light{background:color-mix(in srgb,var(--card) 70%,var(--bg))}
.hd{display:flex;gap:10px;align-items:center;padding:12px 10px 12px 14px;cursor:pointer;user-select:none}
.hd:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:14px}
.chev{width:20px;height:20px;flex:none;color:var(--hint);transition:transform .2s}
.ex.open .chev{transform:rotate(180deg)}
.ex.open{box-shadow:0 0 0 1.5px color-mix(in srgb,var(--accent) 45%,transparent)}
.bd{padding:2px 14px 14px;border-top:1px solid var(--line)}
.ex:not(.open) .bd{display:none}
.sum{font-variant-numeric:tabular-nums}
.sum b{color:var(--ok);font-weight:600}
.upt{color:var(--up);font-weight:600}
.dnt{color:var(--minus);font-weight:600}
.rrow{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}
.rrow label{color:var(--hint);font-size:13px}
.rstart{border:0;background:var(--soft);color:var(--accent);border-radius:10px;padding:8px 12px;font-weight:600}
.rtxt{font-size:14px;font-weight:600}
.npv{margin:4px 0 0;font-size:13px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ex.open .npv{display:none}
.note{display:block;margin-top:12px}
.note span{display:block;font-size:13px;color:var(--hint);margin-bottom:5px}
.note textarea{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;resize:vertical;min-height:44px;font-size:14px}
.note textarea:focus{border-color:var(--accent);outline:none}
.bwrow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border-radius:14px;padding:10px 12px 10px 14px;margin-bottom:10px}
.bwrow b{display:block;font-size:14px;font-weight:600}
.bwrow small{display:block;font-size:12px;color:var(--hint)}
.set::-webkit-inner-spin-button,.set::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.set{-moz-appearance:textfield;appearance:textfield}
.nm{flex:1;min-width:0}
.nm h3{margin:0;font-size:16px;font-weight:600}
.nm p{margin:2px 0 0;color:var(--hint);font-size:13px}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;background:var(--soft);color:var(--hint);margin-left:4px;vertical-align:1px;font-weight:500}
.tag.c{background:color-mix(in srgb,var(--minus) 14%,transparent);color:var(--minus)}
.tag.ts{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.tsh{margin:14px 0 6px;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--hint)}
.wrm{display:flex;align-items:center;gap:10px;width:100%;margin-bottom:6px;padding:8px 10px;border-radius:12px;border:1px solid transparent;background:color-mix(in srgb,var(--bg) 55%,var(--card));font-size:14px;text-align:left}
.wrm.opt{background:transparent;border:1px dashed var(--card2)}
.wrm i{width:22px;height:22px;border-radius:11px;border:1.5px solid var(--card2);display:grid;place-items:center;font-style:normal;font-size:12px;flex:none}
.wrm.on{color:var(--hint)} .wrm.on i{background:var(--btn);border-color:var(--btn);color:var(--btn-text)}
.wrm b{width:52px;font-weight:600} .wrm span{flex:1;font-weight:600} .wrm small{font-size:12px;color:var(--hint)}
.tsrow{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--card2) 55%,var(--card));border-radius:14px;padding:10px 12px}
.tsrow>div{flex:1;min-width:0} .tsrow b{display:block;font-size:14px;font-weight:600} .tsrow small{display:block;font-size:12px;color:var(--hint)}
.tsr{width:58px;height:44px;flex:none;border-radius:12px;border:1.5px solid var(--card2);background:transparent;text-align:center;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;padding:0;-moz-appearance:textfield;appearance:textfield}
.tsr::-webkit-inner-spin-button,.tsr::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.tsr::placeholder{color:var(--hint);opacity:.55;font-weight:500}
.tsr.hit{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)} .tsr.miss{border-color:var(--minus)} .tsr.over{border-color:var(--up)}

/* ---------- Даты и недели ---------- */
const pad = n => String(n).padStart(2, "0");

const parseD = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };

const d0 = new Date();
const TODAY = dstr(d0);
const TODAY_DOW = d0.getDay();
const THIS_MONDAY = dstr(mondayOf(d0));
function weekIndexFor(p, date) {
  if (p.weeks.length < 2) return 0;
  const diff = Math.round((mondayOf(parseD(date)) - parseD(p.anchor)) / (7 * 864e5));
  return ((diff % 2) + 2) % 2;
}
const nowWeek = p => weekIndexFor(p, TODAY);

/* ---------- Состояние ---------- */
const S = { settings: { prog: "main", timer: true }, ex: {}, mon: {} };
const P = {};
let curDay = null, curWeek = null, openKey = null;
let draft = null;
let trainReady = false;

function hashKey(s) {
  s = s.trim().toLowerCase().replace(/ё/g, "е").replace(/\s+/g, " ");
  let h = 0x811c9dc5;
  for (const ch of s) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); }
  return "h_" + (h >>> 0).toString(36);
}
const toRT = e => e.k === "c"
  ? { key: hashKey(e.n + "|c"), name: e.n, cardio: true, min: e.m || 15 }
  : e.sc === "ts"
  ? { key: hashKey(e.n), name: e.n, ts: true, top: e.tr || [5, 6], back: e.br || [6, 8], drop: e.dp || 12.5, warm: !!e.wu,
      rest: e.t || "3 мин", step: e.st || 2.5, sets: [2, 2], reps: [(e.tr || [5])[0], (e.br || [6, 8])[1]], light: false }
  : { key: hashKey(e.n + (e.l ? "|l" : "")), name: e.n, sets: e.s, reps: e.r, rest: e.t, step: e.st || 2.5, light: !!e.l };

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const st = k => (S.ex[k] ||= { w: null, h: [], dr: null });
const fmtR = ([a, b]) => a === b ? a : `${a}–${b}`;
const fmtD = d => d.slice(8, 10) + "." + d.slice(5, 7);
const fmtW = w => w == null ? "—" : String(+(+w).toFixed(2)).replace(".", ",");
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? null : n; };

const prevEntry = s => [...s.h].reverse().find(e => e.d !== TODAY);
function parseRest(t) {
  const n = parseInt((String(t).match(/\d+/) || [])[0], 10);
  if (!n) return 90;
  return /мин/.test(t) && !/сек/.test(t) ? n * 60 : n;
}

const prog = () => P[S.settings.prog] || Object.values(P)[0];
const progList = () => Object.values(P).sort((a, b) => a.c - b.c);
const week = () => prog().weeks[curWeek];

function pickWeekDay() {
  const p = prog();
  if (curWeek == null || curWeek >= p.weeks.length) curWeek = nowWeek(p);
  const days = week().days;
  if (days.includes(curDay)) return;
  const ord = d => (d + 6) % 7, t = ord(TODAY_DOW);
  curDay = days.find(d => d === TODAY_DOW) ?? days.find(d => ord(d) > t) ?? days[0];
}

function suggestion(ex, s) {
  if (ex.cardio || ex.light || s.w == null) return null;
  const [minS] = ex.sets, [, maxR] = ex.reps;
  const last2 = s.h.slice(-2);
  if (last2.length < 2) return null;
  if (!last2.every(e => e.w === s.w && e.r.length >= minS && e.r.every(x => x >= maxR))) return null;
  return Math.max(s.w + ex.step, Math.round(s.w * 1.05 / ex.step) * ex.step);
}

/* ---------- Журнал: дни тренировок ---------- */
const monKey = d => d.slice(0, 4) + d.slice(5, 7);
const mon = k => (S.mon[k] ||= { t: [], bw: {} });

function markTrained(on) {
  const k = monKey(TODAY), m = mon(k), day = +TODAY.slice(8), has = m.t.includes(day);
  if (on && !has) { m.t.push(day); m.t.sort((a, b) => a - b); }
  else if (!on && has) m.t = m.t.filter(x => x !== day);
  else return;
  save("m_" + k, m, true);
}
// старый вес тела из облака Telegram (переносится в таблицу один раз)
function cloudBW() {
  const out = [];
  for (const [k, m] of Object.entries(S.mon)) for (const [d, w] of Object.entries(m.bw || {})) out.push({ d: `${k.slice(0, 4)}-${k.slice(4)}-${pad(+d)}`, v: w });
  return out.sort((a, b) => a.d < b.d ? -1 : 1);
}

function downHint(ex, s) {

  const pe = prevEntry(s); if (!pe || !pe.r) return null;

  const to = pe.w != null ? Math.max(0, Math.min(pe.w - ex.step, Math.round(pe.w * 0.95 / ex.step) * ex.step)) : null;

/* ---------- Таймер отдыха ---------- */
let T = null, tInt = null, actx = null, snd = null, wake = null;
function beepWav() {
  const sr = 22050, n = Math.floor(sr * 0.75), buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const w = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); w(8, "WAVE"); w(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  w(36, "data"); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) {
    const t = i / sr, ph = t % 0.25, on = ph < 0.18;
    const env = on ? Math.min(1, ph / 0.01, (0.18 - ph) / 0.02) : 0;
    v.setInt16(44 + i * 2, Math.round(Math.sin(2 * Math.PI * 880 * t) * env * 0.9 * 32767), true);
  }
  return URL.createObjectURL(new Blob([buf], { type: "audio/wav" }));
}
function audio() {
  try {
    if (!snd) { snd = new Audio(beepWav()); snd.preload = "auto"; snd.setAttribute("playsinline", ""); }
    snd.muted = true;
    const p = snd.play();
    if (p) p.then(() => { snd.pause(); snd.currentTime = 0; snd.muted = false; }).catch(() => {});
  } catch (e) {}
  try { actx ||= new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch (e) {}
}
function webBeep() {
  try {
    const t = actx.currentTime;
    [0, 0.25, 0.5].forEach(o => {
      const os = actx.createOscillator(), g = actx.createGain();
      os.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, t + o);
      g.gain.exponentialRampToValueAtTime(0.3, t + o + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + o + 0.18);
      os.connect(g).connect(actx.destination); os.start(t + o); os.stop(t + o + 0.2);
    });
  } catch (e) {}
}
function beep() {
  try {
    if (!snd) return webBeep();
    snd.muted = false; snd.currentTime = 0;
    const p = snd.play(); if (p) p.catch(webBeep);
  } catch (e) { webBeep(); }
}
async function keepAwake(on) {
  try {
    if (on && !wake && navigator.wakeLock) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => { wake = null; }); }
    if (!on && wake) { const w = wake; wake = null; await w.release(); }
  } catch (e) {}
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && T) { if (!T.fin) keepAwake(true); tick(); }
});
function startTimer(sec, label) {
  audio();
  keepAwake(true);
  T = { end: Date.now() + sec * 1000, total: sec, label, fin: false };
  clearInterval(tInt); tInt = setInterval(tick, 250); tick();
}
function stopTimer() {
  T = null; clearInterval(tInt); keepAwake(false);
  $("tbar").hidden = true; $("tbar").classList.remove("fin"); document.body.classList.remove("timing");
}
function tick() {
  if (!T) return;
  const bar = $("tbar"), left = Math.ceil((T.end - Date.now()) / 1000);
  bar.hidden = false; document.body.classList.add("timing");
  if (left <= 0) {
    if (!T.fin) {
      T.fin = true;
      bar.classList.add("fin");
      $("tbName").textContent = "Отдых окончен — следующий подход";
      $("tbTime").textContent = "0:00";
      $("tbProg").style.width = "100%";
      try { tg.HapticFeedback.notificationOccurred("warning"); } catch (e) {}
      try { navigator.vibrate && navigator.vibrate([300, 150, 300]); } catch (e) {}
      beep();
      const me = T; setTimeout(() => { if (T === me) stopTimer(); }, 8000);
    }
    return;
  }
  bar.classList.remove("fin");
  $("tbName").textContent = "Отдых · " + T.label;
  $("tbTime").textContent = `${Math.floor(left / 60)}:${pad(left % 60)}`;
  $("tbProg").style.width = `${Math.min(100, (1 - left / T.total) * 100)}%`;
}

/* ---------- Загрузка тренировок ---------- */
async function initTrain() {
  const raw = await store.all();
  const J = v => { try { return JSON.parse(v); } catch (e) { return null; } };
  const legacy = [], oldKeys = [], migrated = new Set();
  for (const [k, v] of Object.entries(raw)) {
    const o = J(v); if (!o) continue;
    if (k === "settings") Object.assign(S.settings, o);
    else if (k.startsWith("h_")) S.ex[k] = o;
    else if (k.startsWith("m_")) S.mon[k.slice(2)] = o;
    else if (k.startsWith("ex_")) legacy.push([k, o]);
    else if (k.startsWith("p_")) {
      const id = k.slice(2);
      P[id] = { id, name: o.name, c: o.c, anchor: o.anchor, weeks: (o.weeks || [{ days: o.days || [] }]).map(w => ({ days: w.days || [], d: {} })) };
      if (!o.weeks) migrated.add(id);
    }
  }
  for (const [k, v] of Object.entries(raw)) {
    if (!k.startsWith("pd_")) continue;
    const o = J(v); if (!o) continue;
    let m = k.match(/^pd_(.+)_([12])_(\d)$/);
    if (m && P[m[1]] && P[m[1]].weeks[m[2] - 1]) { P[m[1]].weeks[m[2] - 1].d[m[3]] = o; continue; }
    m = k.match(/^pd_(.+)_(\d)$/);
    if (m && P[m[1]]) { P[m[1]].weeks[0].d[m[2]] = o; oldKeys.push(k); migrated.add(m[1]); }
  }
  for (const p of Object.values(P)) {
    p.weeks = p.weeks.map(w => ({ days: sortDays(w.days.filter(n => w.d[n])), d: w.d })).filter((w, i) => i === 0 || w.days.length);
    if (!p.weeks[0].days.length) { delete P[p.id]; continue; }
    if (!p.anchor) { p.anchor = THIS_MONDAY; migrated.add(p.id); }
    if (p.id === "main" && migrated.has("main") && p.weeks.length === 1) {
      Object.values(p.weeks[0].d).forEach(d => { if (!d.ex.some(e => e.k === "c")) d.ex.push(C("Кардио", 15)); });
      p.weeks.push(clone(p.weeks[0]));
    }
    if (migrated.has(p.id)) saveProg(p);
  }
  store.remove(oldKeys);
  // обновление программы (версия 2): новая «Основная» с разными неделями, прежняя — в «План Б»
  if ((S.settings.progV || 0) < PROG_VERSION) {
    const anchor = P.main && P.main.anchor;
    if (P.main) store.remove(dayKeys(P.main));
    P.main = makeMain(anchor); saveProg(P.main);
    if (!P.planb) { P.planb = makePlanB(); saveProg(P.planb); }
    S.settings.prog = "main"; S.settings.progV = PROG_VERSION;
    save("settings", S.settings, true);
  }
  // версия 3: схема «топ-сет + бэк-офф» на базовых упражнениях (остальное в программе не трогаем)
  if ((S.settings.progV || 0) < 3 && P.main) {
    applyTSPicks(P.main); saveProg(P.main);
    S.settings.progV = 3; save("settings", S.settings, true);
  }
  for (const [k, o] of legacy) {
    const name = LEGACY[k.slice(3)]; if (!name) continue;
    const key = hashKey(name);
    if (!S.ex[key]) { S.ex[key] = o; save(key, o, true); }
  }
  if (legacy.length) store.remove(legacy.map(([k]) => k));
  const dirty = new Set();
  Object.values(S.ex).forEach(x => (x.h || []).forEach(e => {
    const k = monKey(e.d), m = mon(k), day = +e.d.slice(8);
    m.bw ||= {}; m.t ||= [];
    if (!m.t.includes(day)) { m.t.push(day); m.t.sort((a, b) => a - b); dirty.add(k); }
  }));
  dirty.forEach(k => save("m_" + k, S.mon[k], true));
  if (!P[S.settings.prog]) S.settings.prog = progList()[0].id;
  if (S.settings.ui) applyUI(S.settings.ui, false);
  refreshNames();
  trainReady = true;
}

function searchProducts(q) {

function insight() {

  const wr = ws.filter(x => x.d >= from);

  const avg = k => full.length ? full.reduce((a, x) => a + x[k], 0) / full.length : 0;
  const max = Math.max(goalFor(TODAY) * 1.25, ...days.map(d => map[d] ? map[d].kcal : 0));
  let h = `<div class="c-card">

      const v = map[d] ? map[d].kcal : 0, hgt = Math.max(3, Math.round(v / max * 125));

      return `<div><b>${v ? r0(v) : ""}</b><i class="${cls}" style="height:${hgt}px" title="${r0(v)} ккал"></i>${WD[parseD(d).getDay()]}</div>`;

  </div>

    <div class="tile3"><small>Белки</small><b style="color:var(--cP)">${r0(avg("p"))}</b><small>из ${s.p} г</small></div>
    <div class="tile3"><small>Жиры</small><b style="color:var(--cF)">${r0(avg("f"))}</b><small>из ${s.f} г</small></div>
    <div class="tile3"><small>Углеводы</small><b style="color:var(--cC)">${r0(avg("c"))}</b><small>из ${s.c} г</small></div>
  </div>`;
  if (trainReady) {
    const td = new Set(allDates());
    const h28 = hist.filter(x => x.d >= addDays(TODAY, -28) && x.d < TODAY && x.kcal > 300);
    const a = h28.filter(x => td.has(x.d)), b = h28.filter(x => !td.has(x.d));

    }
  }

}
function progTrain() {
  if (!trainReady) return `<div class="c-skel">Загрузка…</div>`;
  const dates = allDates();
  const weeksSet = new Set(dates.map(d => dstr(mondayOf(parseD(d)))));
  let wk = weeksSet.has(THIS_MONDAY) ? THIS_MONDAY : addDays(THIS_MONDAY, -7), streak = 0;
  while (weeksSet.has(wk)) { streak++; wk = addDays(wk, -7); }
  const counts = Array.from({ length: 12 }, (_, i) => { const m = addDays(THIS_MONDAY, (i - 11) * 7), e = addDays(m, 7); return dates.filter(d => d >= m && d < e).length; });
  const mx = Math.max(4, ...counts), plan = prog().weeks[nowWeek(prog())].days.length;
  return `<div class="tiles3">
      <div class="tile3"><small>Всего</small><b>${dates.length}</b><small>тренировок</small></div>
      <div class="tile3"><small>В этом месяце</small><b>${(S.mon[monKey(TODAY)]?.t || []).length}</b><small>тренировок</small></div>
      <div class="tile3"><small>Недель подряд</small><b>${streak}</b><small>без пропуска</small></div>
    </div>
    <div class="c-card"><div class="c-mut" style="font-size:13px;margin-bottom:14px">Тренировки по неделям</div>
      <div class="bars" style="height:145px;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px">${counts.map((c, i) => `<div><b>${c || ""}</b><i class="${i === 11 ? "cur" : c >= plan ? "" : "dim"}" style="height:${Math.max(3, Math.round(c / mx * 120))}px" title="${c}"></i></div>`).join("")}</div>
      <div class="c-row c-mut" style="margin-top:8px;font-size:11px"><span>12 недель назад</span><span>сейчас</span></div>
    </div>`;
}

function demoHistory() {

    case "day": return out({ day: demoDay(b.date) });

      demo.food.push(e); return out({ added: [e], errors: [], day: demoDay(b.date), history: demoHistory() });
    }
    case "editFood": { const e = demo.food.find(x => x.id === b.id), k = b.grams / e.grams; Object.assign(e, { grams: b.grams, kcal: Math.round(e.kcal * k), p: e.p * k, f: e.f * k, c: e.c * k }); return out({ day: demoDay(e.date), history: demoHistory() }); }
    case "delFood": { const e = demo.food.find(x => x.id === b.id); demo.food = demo.food.filter(x => x.id !== b.id); return out({ day: demoDay(e.date), history: demoHistory() }); }
    case "setWeight": demo.weights = demo.weights.filter(x => x.d !== b.date).concat({ d: b.date, v: b.kg }).sort((x, y) => x.d < y.d ? -1 : 1); return out({ weights: demo.weights });
    case "delWeight": demo.weights = demo.weights.filter(x => x.d !== b.date); return out({ weights: demo.weights });
    case "importWeights": return out({ weights: demo.weights });
    case "water": demo.water[b.date] = Math.max(0, (demo.water[b.date] || 0) + b.delta); return out({ day: demoDay(b.date) });
    case "saveSettings": Object.assign(demo.settings, b.settings); return out({ settings: demo.settings });
    case "addProduct": demo.products.push({ name: b.name, aliases: b.aliases, state: "", kcal: b.kcal, p: b.p, f: b.f, c: b.c, piece: b.piece }); return out({ products: demo.products });
    case "history": return out({ history: demoHistory() });
  }
  throw new Error("demo: " + action);
}

/* ---------- Старт ---------- */
(async () => {
  resolveTheme();
  showView("home");
  const [tr, boot] = await Promise.allSettled([initTrain(), api("boot", { date: TODAY })]);
  if (tr.status === "rejected") console.error(tr.reason);
  if (boot.status === "fulfilled") {
    const b = boot.value;
    D = { settings: b.settings, products: b.products, weights: b.weights || [], history: b.history || [], recent: b.recent || [] };
    DAY[TODAY] = b.day;
    // одноразовый перенос веса тела из старого дневника тренировок в таблицу
    if (trainReady && !S.settings.bwMoved) {
      const old = cloudBW(), have = new Set(D.weights.map(w => w.d)), list = old.filter(w => !have.has(w.d));
      if (list.length && !DEMO) api("importWeights", { list }).then(r => { D.weights = r.weights; S.settings.bwMoved = true; save("settings", S.settings, true); render(); }).catch(console.error);
      else if (!DEMO) { S.settings.bwMoved = true; save("settings", S.settings, true); }
    }
  } else {
    bootErr = true; fail(boot.reason);
  }
  render();
})();
</script>
